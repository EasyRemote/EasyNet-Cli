name: Clippy Ratchet

env:
  EASYNET_AXON_COMPAT_REV: 25a97cc5e32610c3c81f26d085cb34deb50d7230

# Enforces the lint ratchet (src/lib.rs `#![deny(...)]`): the lint
# categories cleared to zero stay zero. A regression in any denied
# category turns `cargo clippy` into a hard error, failing the PR —
# the CI half of F-005's "lower the warn set, never raise it" policy.
# The still-open categories (result_large_err, too_many_arguments)
# remain warnings and do NOT fail CI until their tracked fixes land.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      # `easynet-axon = { path = "../EasyNet-Axon/sdk/rust" }` — the
      # sibling repo must sit next to this one for the path dep to
      # resolve. Check both out under the workspace root.
      - name: Checkout EasyNet-Cli
        uses: actions/checkout@v4
        with:
          path: EasyNet-Cli

      # NOTE: EasyNet-Axon is a separate (private) repo, so the default
      # GITHUB_TOKEN cannot read it. Provide a PAT/deploy key with read
      # access to EasyRemote/EasyNet-Axon as the `AXON_CHECKOUT_TOKEN`
      # repository secret before enabling this workflow; without it the
      # checkout step fails fast with a clear permissions error.
      - name: Checkout EasyNet-Axon (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: EasyRemote/EasyNet-Axon
          path: EasyNet-Axon
          token: ${{ secrets.AXON_CHECKOUT_TOKEN || github.token }}
          ref: ${{ env.EASYNET_AXON_COMPAT_REV }}

      - name: Install Rust + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            EasyNet-Cli/target
          key: clippy-${{ runner.os }}-${{ hashFiles('EasyNet-Cli/Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-

      # The ratchet lives in the lib's crate-level attributes, so the
      # lib target with the axon-pb feature is the surface that
      # exercises it. A denied-category regression exits non-zero here.
      - name: Clippy ratchet (denied categories must stay clean)
        working-directory: EasyNet-Cli
        run: cargo clippy --lib --features axon-pb
