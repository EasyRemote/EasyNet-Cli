name: Main Admission

# Compiles ALL test targets and runs the lib suite. This is the CI
# that would have caught the five test-construction breaks the
# 2026-06-12 full-suite sweep found: `cargo build` (the prior
# verification) does NOT build test targets, so a struct field or fn
# signature change can leave a test/integration construction site
# broken with nothing to flag it. `cargo test --no-run` builds every
# target (catching those), and `cargo test --lib` runs the unit suite
# (catching runtime regressions like a drifted help template).
#
# Integration-test BODIES that need a daemon / network / docker are not
# run here (they are operator-provisioned, the same boundary the
# integration repo's testbed tier draws); --no-run still compiles them,
# which is what catches field/arg drift.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  compatibility-coordinate:
    runs-on: ubuntu-latest
    outputs:
      axon_revision: ${{ steps.coordinate.outputs.axon_revision }}
      axon_contract_sha256: ${{ steps.coordinate.outputs.axon_contract_sha256 }}
    steps:
      - name: Checkout EasyNet-Cli
        uses: actions/checkout@v4
        with:
          path: EasyNet-Cli

      - name: Verify compatibility tooling and expose pinned coordinate
        id: coordinate
        working-directory: EasyNet-Cli
        run: |
          python3 tools/scripts/test_check_axon_lock.py
          python3 tools/scripts/test_check_workflow_integrity.py
          python3 tools/scripts/check-workflow-integrity.py
          python3 tools/scripts/check-axon-lock.py --lock-only --github-output

  pinned:
    needs: compatibility-coordinate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout EasyNet-Cli
        uses: actions/checkout@v4
        with:
          path: EasyNet-Cli

      - name: README Fact Check
        working-directory: EasyNet-Cli
        run: |
          python3 tools/scripts/check_readme_facts.py --self-test
          python3 tools/scripts/check_readme_facts.py

      # Sibling path dependency (easynet-axon = { path =
      # "../EasyNet-Axon/sdk/rust" }). Private repo: needs an
      # AXON_CHECKOUT_TOKEN secret with read access, same as the clippy
      # workflow; falls back to the default token so the file is valid
      # before the secret is set.
      - name: Checkout EasyNet-Axon (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: EasyRemote/EasyNet-Axon
          path: EasyNet-Axon
          token: ${{ secrets.AXON_CHECKOUT_TOKEN || github.token }}
          ref: ${{ needs.compatibility-coordinate.outputs.axon_revision }}

      - name: Verify EasyNet-Axon dependency contract
        working-directory: EasyNet-Cli
        run: python3 tools/scripts/check-axon-lock.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install pinned rustdoc JSON toolchain
        run: rustup toolchain install nightly-2026-02-19 --profile minimal

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache-dependency-path: EasyNet-Cli/sdk/go/go.sum

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: |
            EasyNet-Cli/sdk/python/pyproject.toml
            EasyNet-Axon/sdk/python/pyproject.toml

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.10+7"

      - name: Install Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.9.12"

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.1"

      - name: Install Python SDK test tools
        working-directory: EasyNet-Cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==7.4.4 ruff==0.13.2 mypy==1.11.2
          python -m pip install -e ../EasyNet-Axon/sdk/python -e sdk/python

      - name: Install pinned Node SDK tools
        working-directory: EasyNet-Cli/sdk/node
        run: npm ci

      - name: Verify pinned SDK toolchains
        working-directory: EasyNet-Cli
        run: bash tools/scripts/check-sdk-toolchains.sh

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            EasyNet-Cli/target
          key: tests-${{ runner.os }}-${{ hashFiles('EasyNet-Cli/Cargo.lock') }}
          restore-keys: tests-${{ runner.os }}-

      # Compile every test target (lib, integration, doc) — this alone
      # catches construction-site drift that cargo build misses.
      - name: Compile all test targets
        working-directory: EasyNet-Cli
        run: cargo test --features axon-pb --no-run

      - name: Format and clippy admission
        working-directory: EasyNet-Cli
        run: |
          cargo fmt --all --check
          cargo clippy --locked --lib --features axon-pb

      # Run the unit suite — catches runtime regressions. Integration
      # bodies needing infra are excluded (--lib only).
      - name: Run the lib test suite
        working-directory: EasyNet-Cli
        run: cargo test --features axon-pb --lib

      - name: Run Go SDK tests
        working-directory: EasyNet-Cli/sdk/go
        run: go test ./...

      - name: Run Python SDK tests
        working-directory: EasyNet-Cli
        run: python -m pytest -q sdk/python/tests

      - name: Run Node SDK tests and type contract
        working-directory: EasyNet-Cli/sdk/node
        run: |
          npm test
          npx tsc --strict --noEmit --module nodenext --moduleResolution nodenext test/types.test.ts

      - name: Run Java SDK suite
        working-directory: EasyNet-Cli/sdk/java
        run: |
          mvn --batch-mode test
          java -cp target/test-classes:target/classes run.runtime.sdk.RuntimeCoreSeamTest

      - name: Run Swift SDK suite
        working-directory: EasyNet-Cli/sdk/swift
        run: swift test

      - name: Lint Python SDK and tests
        working-directory: EasyNet-Cli
        run: ruff check sdk/python/easynet_sdk sdk/python/tests sdk/conformance/python_sdk_type_contract.py

      - name: Verify Python SDK type contract
        working-directory: EasyNet-Cli
        run: bash tools/scripts/check-python-sdk-static-contract.sh

      - name: Verify SDK inventories and provider neutrality
        working-directory: EasyNet-Cli
        run: |
          bash tools/scripts/check-sdk-canonical-public-api.sh
          bash tests/scripts/test_check_sdk_product_neutrality.sh

      # The coverage manifests cannot attest pass/fail. This gate verifies
      # case/evidence hashes, collection, and each exact runner-owned selector.
      - name: Execute SDK conformance adapters
        working-directory: EasyNet-Cli
        run: |
          cargo test --locked -p sdk-conformance-runner -- --test-threads=1
          bash tools/scripts/check-sdk-conformance-reports.sh --self-test
          SDK_CONFORMANCE_RESULT_DIR="$PWD/target/sdk-conformance-live-results" \
            bash tools/scripts/check-sdk-conformance-reports.sh
          EASYNET_SDK_PARITY_RESULTS_DIR="$PWD/target/sdk-conformance-live-results" \
            bash tools/scripts/check-sdk-parity-matrix.sh

      # A source/header-only check cannot detect stale or accidental cdylib
      # exports. Build the actual shared library and compare its normalized
      # dynamic symbol table against the canonical base-v7 allowlist. The v8
      # raw-stream entry point is additive and feature-detected.
      - name: Verify exact generic C ABI v7/v8/v9 extension exports
        working-directory: EasyNet-Cli
        run: |
          cargo build --features axon-pb --lib
          bash packaging/release/constrain-c-abi-exports.sh \
            --library "target/debug/libeasynet_cli.$([[ \"$(uname -s)\" == Darwin ]] && echo dylib || echo so)" \
            --allowlist include/easynet_cli.exports.v9
          EASYNET_FFI_REQUIRE_DYLIB=1 bash tools/scripts/check-ffi-abi-v7-header.sh
          EASYNET_FFI_REQUIRE_DYLIB=1 bash tools/scripts/check-ffi-abi-v8-header.sh
          EASYNET_FFI_REQUIRE_DYLIB=1 bash tools/scripts/check-ffi-abi-v9-header.sh
          bash tests/scripts/test_check_ffi_abi_v8_header.sh
          bash tests/scripts/test_check_ffi_abi_v9_header.sh

  main-admission:
    name: main-admission
    if: always()
    needs: [compatibility-coordinate, pinned]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete pinned CLI admission
        env:
          ADMISSION_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {
              name: detail["result"]
              for name, detail in json.loads(os.environ["ADMISSION_RESULTS"]).items()
          }
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              raise SystemExit(f"CLI main admission failed: {failed}")
          print("CLI main admission passed")
          PY
