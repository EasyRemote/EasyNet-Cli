[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easynet-sdk"
version = "0.91.30"
description = "Python implementation of the canonical runtime SDK with explicit provider integrations."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "cryptography>=41",
    "axon-sdk>=0.129.23",
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[tool.uv.sources]
axon-sdk = { path = "../../../EasyNet-Axon/sdk/python", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["easynet_sdk*"]

[tool.setuptools.package-data]
easynet_sdk = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
