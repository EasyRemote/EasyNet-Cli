id: memc/consumer_coverage
profile: memc
required_for:
  - rust
  - c_abi
  - go
  - python
  - node
  - java
  - swift
description: First-class consumers can express daemon runtime needs through declared SDK profiles.
steps:
  - action: inspect_consumer_coverage
expect:
  result: ok
  consumers:
    - backend_hub
    - easyremote
    - cli
    - desktop_gui
    - third_party_host_app
    - future_bindings
  forbidden_lower_layers:
    - axon_sdk_proto
    - c_abi_direct
    - raw_daemon_socket
    - control_frame_product_call
    - cli_subprocess
    - easyremote_dependency
    - product_local_daemon_transport
  backend_hub_profiles:
    - runtime_core
    - directory_identity
    - receipt
    - events
    - admin_gateway
    - surface
    - compatibility
    - publication
    - wrappers
  easyremote_profiles:
    - runtime_core
    - directory_identity
    - publication
    - host_binding
    - mission
    - admin_gateway
  cli_profiles:
    - runtime_core
    - directory_identity
    - publication
    - host_binding
    - mission
    - admin_gateway
    - wrappers
  desktop_gui_profiles:
    - runtime_core
    - directory_identity
    - wrappers
  third_party_host_app_profiles:
    - runtime_core
    - directory_identity
    - publication
    - host_binding
  future_bindings_required_profile_set: release_tier
  raw_lower_layer_dependency: false
