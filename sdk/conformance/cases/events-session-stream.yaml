id: events/session_stream
profile: events
required_for:
  - rust
  - c_abi
  - go
  - python
description: EventClient builds session stream Invocation carriers for daemon session.attach with explicit daemon session_id, rejects product session_ura facade parsing, and maps session cursor sequence to since_seq.
steps:
  - action: build_session_subscription_invocation
    fixture: events-session-subscription-request.v4.json
expect:
  result: events_session_stream_carrier_observed
  request_schema: events-session-subscription-request.schema.json
  invocation_schema: invocation.schema.json
  subscription_invocation_fixture: events-session-subscription-invocation.v4.json
  stream_system_ability: session.attach
  explicit_session_id_required: true
  product_session_ura_parsing_allowed: false
  resume_cursor_sequence_maps_to_since_seq: true
  other_event_streams: provider_backed
