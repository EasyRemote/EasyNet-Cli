id: receipt/projection_causal_ref
profile: receipt
required_for:
  - rust
  - c_abi
  - go
  - python
  - node
  - java
  - swift
description: Receipt projection normalizes summary DTOs, refuses to claim summary-only cryptographic verification, and builds causal refs only from explicit opaque receipt URA plus hash facts.
steps:
  - action: project_receipt_summary
    fixture: receipt.summary.v4.json
  - action: verify_receipt_summary
    fixture: receipt.summary.v4.json
  - action: require_cryptographic_verification
  - action: build_receipt_body_ura
  - action: project_opaque_receipt_ref
    fixture: receipt-ref.v4.json
  - action: build_causal_ref
    fixture: receipt.summary.v4.json
expect:
  result: receipt_projection_observed
  summary_schema: receipt.schema.json
  summary_verified: false
  verify_summary_claims_cryptographic_validity: false
  require_cryptographic_summary_result: err_invalid_arg
  receipt_body_ura_builder: provider_backed
  receipt_body_ura_shape: easynet:///r/example/resource/agent.alice.sdk/invocation/inv-example-1/receipt
  opaque_receipt_ref_fixture: receipt-ref.v4.json
  receipt_ref_constructs_receipt_ura: false
  receipt_ref_requires_receipt_ura_and_hash: true
  causal_ref_requires_receipt_ura_and_hash: true
  causal_ref_fixture_result: err_invalid_arg
