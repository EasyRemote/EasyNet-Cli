id: invocation/local_daemon_signing_boundary
profile: runtime_core
required_for:
  - rust
  - c_abi
  - go
  - python
description: Local daemon signing still creates a SignedInvocation before submission.
steps:
  - action: prepare
    fixture: invocation.complete.v4.json
  - action: local_daemon_sign
expect:
  result: ok
  public_object: SignedInvocation
  signer_handle_profile: directory_identity
  signer_handle_policy_mode: local_daemon_signing
  signer_handle_policy_usage: invocation.sign
  signer_handle_source: daemon_key_inventory
  forged_signer_handle_rejected: true
  signer_workflow_acquisition_provider_bound: true
