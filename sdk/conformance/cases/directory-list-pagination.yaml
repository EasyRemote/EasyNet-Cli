id: directory/list_pagination
profile: directory_identity
required_for:
  - rust
  - c_abi
  - go
  - python
description: Directory list APIs build read-model Invocation carriers, project bounded pages, and reject requests above MaxPageSize.
steps:
  - action: build_list_devices_invocation
    fixture: directory-list-devices-request.v4.json
  - action: build_list_agents_invocation
    fixture: directory-list-agents-request.v4.json
  - action: project_device_page
    fixture: directory-device-page.v4.json
  - action: project_agent_page
    fixture: directory-agent-page.v4.json
  - action: list_devices
    query:
      limit: 1000000
expect:
  result: directory_pages_observed
  page_schema: directory-page.schema.json
  device_request_schema: directory-list-devices-request.schema.json
  agent_request_schema: directory-list-agents-request.schema.json
  device_invocation_fixture: directory-list-devices-invocation.v4.json
  agent_invocation_fixture: directory-list-agents-invocation.v4.json
  max_page_size: 500
  oversized_limit_result: error
  error_code: INVALID_ARGUMENT
