id: memc/semantic_alignment
profile: memc
required_for:
  - rust
  - c_abi
  - go
  - python
  - node
  - java
  - swift
description: Shared SDK terms map to the same daemon/Axon owners across documents and language facades.
steps:
  - action: inspect_semantic_ledger
  - action: verify_term_ownership
  - action: reject_product_specific_sdk_terms
expect:
