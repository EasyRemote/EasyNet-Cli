id: runtime_companion/control
profile: runtime_control
required_for:
  - go
  - python
description: Runtime companion control facades project shared companion status/action DTOs and dispatch lifecycle actions through daemon transport providers without owning platform supervisor policy.
steps:
  - action: project_companion_status_dto
    schema: desktop-companion-status.schema.json
  - action: project_companion_action_result_dto
    schema: desktop-companion-action.schema.json
  - action: call_companion_list
  - action: call_companion_status
  - action: call_companion_lifecycle_action
expect:
  result: runtime_companion_control_projected
  status_kind: desktop_companion_status
  action_kind: desktop_companion_action_result
  transport_owner: daemon_control_provider
  shell_out: false
  platform_supervisor_owner: daemon
