id: invocation/provider_managed_signing_boundary
profile: runtime_core
required_for:
  - rust
  - c_abi
  - go
  - python
description: Provider-managed signing still creates a SignedInvocation before submission.
steps:
  - action: prepare
    fixture: invocation.complete.v4.json
  - action: provider_managed_sign
expect:
  result: ok
  public_object: SignedInvocation
  signer_handle_profile: signing
  signer_handle_policy_mode: provider_managed_signing
  signer_handle_policy_usage: invocation.sign
  signer_handle_policy_ref_required: true
  signer_handle_inventory_owner_bound: true
  signer_handle_key_state: active
  signer_handle_source: provider_key_inventory
  forged_signer_handle_rejected: true
  signer_workflow_acquisition_provider_bound: true
