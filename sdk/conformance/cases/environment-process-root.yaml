id: environment/process_root
profile: runtime_core
required_for:
  - go
  - python
description: SdkEnvironment is the process-level SDK root for feature discovery, ABI checks, daemon lifecycle facade access, local runtime connection, and idempotent cleanup.
steps:
  - action: create_environment
  - action: require_abi
  - action: discover_daemon
  - action: connect_local_runtime
  - action: close_environment
  - action: reject_after_close
expect:
  result: ok
  exposes_raw_axon: false
  owns_invocation_tuple: false
  close_idempotent: true
  connect_local_starts_daemon: false
