id: directory/subscription_stream
profile: directory_identity
required_for:
  - go
  - python
description: DirectoryClient builds complete Invocation carriers for daemon directory.subscribe and projects snapshot/live subscription state without facade-side fan-out.
steps:
  - action: build_directory_subscription_invocation
    fixture: directory-subscription-request.v4.json
  - action: subscribe_directory
    fixture: directory-subscription-request.v4.json
  - action: project_directory_subscription
    fixture: directory-subscription.v4.json
expect:
  result: directory_subscription_observed
  request_schema: directory-subscription-request.schema.json
  subscription_schema: directory-subscription.schema.json
  invocation_schema: invocation.schema.json
  subscription_invocation_fixture: directory-subscription-invocation.v4.json
  subscription_fixture: directory-subscription.v4.json
  stream: directory
  stream_system_ability: directory.subscribe
  cursor_required: true
  max_buffered_events: 1024
  live_requires_snapshot_complete: true
  facade_fanout: none
