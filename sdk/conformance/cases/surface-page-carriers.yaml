id: surface/page_carriers
profile: surface
required_for:
  - rust
  - c_abi
  - go
  - python
description: Surface page APIs build complete Invocation carriers over daemon pages abilities and project daemon page facts without owning backend rendering.
steps:
  - action: build_surface_list_pages_invocation
    fixture: surface-list-pages-request.v4.json
  - action: build_surface_create_page_invocation
    fixture: surface-create-page-request.v4.json
  - action: build_surface_delete_page_invocation
    fixture: surface-delete-page-request.v4.json
  - action: build_surface_manifest_invocation
    fixture: surface-manifest-request.v4.json
  - action: build_surface_health_invocation
    fixture: surface-health-request.v4.json
  - action: project_surface_page_page
    fixture: surface-page-page.v4.json
  - action: project_surface_manifest
    fixture: surface-manifest.v4.json
  - action: project_surface_health
    fixture: surface-health.v4.json
  - action: project_surface_status
    fixture: surface-health.v4.json
expect:
  result: surface_page_carriers_observed
  request_schemas:
    - surface-list-pages-request.schema.json
    - surface-create-page-request.schema.json
    - surface-page-project-request.schema.json
    - surface-health-request.schema.json
  projection_schemas:
    - surface-page.schema.json
    - surface-page-page.schema.json
    - surface-manifest.schema.json
    - surface-public-page-ref.schema.json
    - surface-mutation-result.schema.json
    - surface-health.schema.json
  daemon_abilities:
    - pages.list
    - pages.publish
    - pages.get
    - pages.unpublish
    - pages.health
  health_invocation_fixture: surface-health-invocation.v4.json
  health_fixture: surface-health.v4.json
  surface_status_aliases_health: true
  health_descriptor_ref_source: identity_built_invocation
  facade_descriptor_concat: false
  health_rendering_owner: backend
  backend_rendering_owned_by_sdk: false
  direct_filesystem_page_transport: false
