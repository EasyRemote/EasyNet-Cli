id: python/easyremote_profile_extraction
profile: sdk_parity
required_for:
  - python
description: EasyRemote product modules keep only product ergonomics while generic daemon profile transport, carriers, host-stream codecs, addressing, and lifecycle semantics are absorbed by the Python Daemon SDK.
steps:
  - action: audit_consumer_source
    consumer: easyremote
  - action: audit_consumer_manifest
    consumer: easyremote
  - action: inspect_sdk_profile_facade_usage
expect:
  result: ok
  retained_easyremote_roles:
    - ComputeNode
    - remote_decorator
    - python_schema_extraction
    - warm_python_host_process
    - pipeline_dsl
    - server_tls_guidance
  required_sdk_profiles:
    - runtime_core
    - directory_identity
    - receipt
    - publication
    - host_binding
    - mission
    - admin_gateway
  required_sdk_types:
    - DaemonControl
    - RuntimeClient
    - InvocationObjectAdapter
    - AddressingClient
    - IdentityClient
    - ReceiptClient
    - PublicationClient
    - PublicationCatalogFacade
    - HostBindingClient
    - MissionClient
    - AdminClient
    - GatewayLifecycleFacade
  forbidden_semantic_markers:
    - raw_transport_module
    - raw_publication_carrier
    - raw_host_stream_codec
    - raw_mission_carrier
    - raw_admin_carrier
    - raw_addressing_helper
    - raw_descriptor_ref_assembly
    - raw_ura_shape_literal
    - sdk_internal_runtime_transport
    - raw_daemon_session
    - runtime_subprocess
  raw_lower_layer_dependency: false
  product_facade_only: true
