id: bidi/frame0_required
profile: runtime_core
required_for:
  - go
  - python
description: Runtime Core bidi open rejects a missing or non-EnvelopeOpen frame0 before entering a runtime session.
steps:
  - action: open_bidi_without_frame0
    fixture: invocation.complete.v4.json
  - action: reject_before_runtime_session_entry
expect:
