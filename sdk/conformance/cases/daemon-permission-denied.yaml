id: daemon/permission_denied
profile: runtime_core
required_for:
  - rust
  - c_abi
  - go
  - python
description: Socket, daemon, or runtime permission failures map to the canonical SDK PermissionDenied error class without falling back to untyped transport or admission text parsing.
steps:
  - action: deny_runtime_permission
  - action: project_typed_error
expect:
  code: PERMISSION_DENIED
  retry: never
  error_class: permission
