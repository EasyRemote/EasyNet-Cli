id: backend/import_ban
profile: backend_cutover
required_for:
  - go
description: The backend SDK-only boundary detector must accept an SDK-only fixture and reject raw Axon packages, generated Axon protobufs, direct daemon transports, C ABI/FFI, EasyRemote, and product runtime subprocess fixtures. Current backend cleanliness remains external live evidence.
steps:
  - action: run_backend_import_guard_self_test
  - action: accept_sdk_only_fixture
  - action: reject_raw_axon_imports
  - action: reject_generated_axon_pb_imports
  - action: reject_generated_axon_pb_packages
  - action: reject_direct_daemon_transport
  - action: reject_direct_daemon_transport_packages
  - action: reject_raw_daemon_socket_markers
  - action: reject_cabi_ffi_markers
  - action: reject_runtime_subprocess
expect:
  result: backend_sdk_only_boundary_detector_enforced
  allowed_runtime_import: easynet.run/cli/sdk/go
  raw_axon_import: false
  generated_axon_pb_import: false
  generated_axon_pb_package: false
  direct_daemon_transport: false
  direct_daemon_transport_package: false
  raw_daemon_socket_marker: false
  c_abi_ffi: false
  runtime_subprocess: false
  easyremote_runtime_dependency: false
  current_backend_scan_claimed: false
