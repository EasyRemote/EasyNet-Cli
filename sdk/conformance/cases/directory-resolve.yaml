id: directory/resolve
profile: directory_identity
required_for:
  - rust
  - c_abi
  - go
  - python
description: Directory resolve builds a namespace.resolve Invocation carrier and projects daemon ResolveAnswer JSON into a stable ResolvedRef DTO without SDK-owned route selection.
steps:
  - action: build_resolve_invocation
    fixture: directory-resolve-request.v4.json
  - action: project_resolved_ref
    fixture: directory-resolved-ref.v4.json
expect:
  result: resolved_ref_observed
  request_schema: directory-resolve-request.schema.json
  resolved_ref_schema: directory-resolved-ref.schema.json
  invocation_fixture: directory-resolve-invocation.v4.json
  resolved_ref_fixture: directory-resolved-ref.v4.json
  daemon_ability: namespace.resolve
  fanout: none
  route_selection_owner: daemon
