id: mission/plan_child_invocation
profile: mission
required_for:
  - go
  - python
description: Mission SDK facades render deterministic EAL plan source and validate daemon MissionStatus child Invocation facts without owning Mission execution or fabricating receipts.
steps:
  - action: render_plan_eal
    fixture: mission-status.v4.json
  - action: project_child_invocation_intents
    fixture: mission-status.v4.json
  - action: validate_child_invocation_facts
    fixture: mission-status.v4.json
  - action: reject_foreign_step_output
  - action: reject_structured_plan_field
expect:
  result: mission_plan_child_invocation_observed
  plan_name: nightly
  first_step: observe.health
  second_step: notify.user
  step_output_ref: health.output
  mismatch_reason: mission_child_invocation_mismatch
  rejects_foreign_step_output: true
  rejects_structured_plan_field: true
  receipt_backed_steps: true
  sdk_executes_mission: false
