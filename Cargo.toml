[package]
name = "easynet"
version = "0.1.5"
edition = "2021"
description = "EasyNet CLI + Hub MCP server + EAL (EasyNet Ability Language)."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
console = "0.15"
ctrlc = "3"
easynet-axon = { path = "../EasyNet-Axon/sdk/rust" }
gethostname = "0.5"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
termimad = "0.31"
toml_edit = "0.23"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
