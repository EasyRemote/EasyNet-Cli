[package]
name = "easynet"
version = "0.139.14"
edition = "2021"
description = "Device runtime and CLI for publishing and invoking governed abilities over EasyNet."
authors = ["Silan Hu <silan.hu@u.nus.edu>"]
homepage = "https://easynet.run"
repository = "https://github.com/EasyRemote/EasyNet-Cli"
license = "Apache-2.0"
build = "build.rs"

[workspace]
members = [
    ".",
    "plugins/browser",
    "plugins/remote-desktop",
    "tools/sdk-conformance-runner",
]

[features]
default = ["axon-pb", "browser-cdp", "remote-desktop", "native-media"]

# Compile schemas/*.proto into Rust types via prost-build. Off by
# default in v1 so developers without protoc installed can still
# build the CLI; feature gate flips on once the proto-generated
# types start being consumed. v10.5 R1 PR-DAEMON ships the .proto
# files and the toolchain wiring, but does NOT flip any call site
# to use the generated types (that is a follow-up commit / PR-SYS).
proto-gen = ["dep:prost-types", "dep:prost-build"]

# Enable Axon's SDK-owned `pb` module exposing the tonic server-side
# `Invocation` trait that RFC-003 PR-1 implements. This is part of the
# current runtime plane: daemon invocation transport, remote routing, receipt
# forwarding, and live discovery all depend on it. The SDK owns Axon proto
# codegen; CLI must not compile `../EasyNet-Axon/.../proto` directly.
axon-pb = [
    "axon-sdk/grpc",
    "dep:tonic",
    # PR-N1 commit 8/N CLI bridge needs the UDS-over-tonic adapters.
    "dep:tower",
    "dep:hyper-util",
]

# Compile the provider-backed browser plugin and its version-tolerant CDP
# transport. Browser commands/events remain application payloads carried by
# Axon InvokeBidi; this feature does not add browser semantics to Axon.
browser-cdp = ["dep:tokio-tungstenite", "dep:url"]

# Compile the in-tree remote desktop plugin package and its media transport
# stack. This is part of the current product surface: Frontend remote desktop,
# plugin discovery, and typed remote_desktop.* receipts all depend on these
# ability names being present in ordinary daemon builds. Operators can still
# disable runtime loading with EASYNET_REMOTE_DESKTOP_PLUGIN=off; that gate must
# not change descriptor generation.
remote-desktop = [
    "dep:openh264",
    "dep:opus",
    "dep:webrtc",
    "dep:rtc",
    "dep:objc2-screen-capture-kit",
    "dep:objc2-video-toolbox",
]

# Compile native physical-device media backends. Ordinary product daemon builds
# keep this enabled by default. Headless Linux runtime artifacts used by Docker
# E2E disable default features and retain only the canonical runtime invocation
# plane, avoiding GUI/Wayland/pkg-config coupling for scenarios that do not
# exercise physical camera/screen/mic hardware.
native-media = [
    "dep:cpal",
    "dep:nokhwa",
    "dep:xcap",
]

# Compile provider-backed synthetic media handlers for headless Docker/CI
# runtime artifacts. This keeps canonical media routes and receipt chains
# present without linking native camera/screen/mic stacks into Linux images
# that cannot access physical devices.
headless-media = []

# v10.5 R1 (PR-DAEMON): split historical binary-only crate into a
# library + multiple bins. The library target carries all the
# business modules and (future) C ABI exports; bins are thin entry
# points linking the library.
#
#  - rlib      — Rust-to-Rust internal linking (bins in this crate)
#  - cdylib    — shared library for C FFI callers (Go/Python/Swift/...)
#  - staticlib — static archive for platforms preferring static link (iOS)
#
# `dylib` deliberately excluded: it carries Rust symbol mangling;
# goal is a stable C ABI, not a stable Rust ABI.
[lib]
name = "easynet_cli"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]
bench = false

[[bin]]
name = "easynet"
path = "src/bin/easynet.rs"

# Per-user runtime authority. Owns lifecycle, discovery, canonical
# Invocation admission/dispatch, live ability publication, and local
# control IPC. `easynet start/stop/status` supervises this binary.
[[bin]]
name = "easynet-daemon"
path = "src/bin/easynet-daemon.rs"
required-features = ["axon-pb"]

# RFC-001 plan v4.1.5 Phase 3A. Long-running per-user vault for
# the device's Ed25519 keypair. backend / easynet-daemon / CLI all
# request signatures from this process over UDS — no other path
# may hold the raw seed bytes. Ships an `easynet-keyring start`
# semantics: read passphrase, open `~/.easynet/keyring.enc`, bind
# `~/.easynet/keyring.sock`, accept loop. Stateless on the wire,
# stateful on disk.
[[bin]]
name = "easynet-keyring"
path = "src/bin/easynet-keyring.rs"

[[bin]]
name = "easynet-session-supervisor"
path = "src/bin/easynet-session-supervisor.rs"

# Maintainer tool. Regenerates grouped system AbilityDescriptor TOMLs
# under ability-descriptors/system/. Run after any change to a
# `description_*` / `input_schema_*` function; the
# `every_published_ability_has_a_toml_byte_for_byte_matching_the_renderer`
# test in src/daemon/ability/catalog/assembly_tests.rs fails CI if the on-disk TOML
# drifts from what this binary would emit.
#
#   cargo run --bin gen-ability-tomls
[[bin]]
name = "gen-ability-tomls"
path = "src/bin/gen-ability-tomls.rs"

[[bin]]
name = "real-user-smoke"
path = "src/bin/real-user-smoke.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
console = "0.15"
crossterm = "0.29"
# Arrow-key TUI picker for `easynet agent send --resume` and any
# future "pick from a list" surface. Thin wrapper over `console`
# (already a direct dep), so adding `dialoguer` reuses the same
# terminal-style backend rather than pulling a second TUI stack.
dialoguer = { version = "0.11", default-features = false }
crossbeam-queue = "0.3"
ctrlc = "3"
# Concurrent shard-locked map. PresenceRegistry (RFC-003 PR-1 spec §3)
# uses one DashMap<device_ura, DispatchSender> with shard count
# tuned via `with_shard_amount(num_cpus * 4)`. The full feature
# justification — bounded backpressure, shard-locked sub-millisecond
# lookups across thousands of devices — is documented in
# `daemon/invocation/state/presence.rs` module docs.
dashmap = "6"
prost = "0.13"
# async-trait — required by RFC-003 PR-2's `SessionFrameDispatcher`
# trait so trait method bodies can be `async fn`. Already pulled in
# transitively via tonic; declared direct so the daemon's surface
# use is documented.
async-trait = "0.1"

# tokio-stream wrappers used by RFC-003 PR-1:
#  - `sync` feature: BroadcastStream for the
#    `federation.subscribe_directory` server-stream pump (spec §4)
#  - `net` feature: UnixListenerStream so the daemon binary's
#    gRPC InvocationServer can serve over UDS via
#    `Server::serve_with_incoming(...)` (spec §1.1 — daemon.sock)
# Promoted from a transitive dep (already pulled in via tonic) to a
# direct dep so the daemon's surface use is documented in Cargo.toml.
tokio-stream = { version = "0.1", features = ["sync", "net"] }
axon-sdk = { path = "../EasyNet-Axon/sdk/rust" }
# Skill-install adapter needs tarball extraction + hex encoding of
# the content_hash digest. Kept as direct deps (not via axon-sdk)
# because the skill subcommand is self-contained.
flate2 = "1"
gethostname = "0.5"
hex = "0.4"
tar = "0.4"
fs2 = "0.4"
indicatif = "0.17"
num_cpus = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
# Used by `daemon::federation::publish::derive_owner_public_key_b64` to mirror
# the SDK's deterministic key derivation — the daemon must pass the
# runtime the SAME key the bridge will later sign under, or
# `verify_easynet_subject_key_binding` rejects every Invoke. Version
# pinned to match the SDK's transitive use.
ed25519-dalek = "2"
# RFC-002 keyring: AES-GCM encrypts private keys at rest under a master
# key derived from OS keychain (preferred) or passphrase (fallback).
aes-gcm = "0.10"
# Argon2id KDF for passphrase-fallback master key derivation.
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc", "password-hash"] }
# CSPRNG for keypair generation, AES-GCM nonces, master-key salts.
rand = "0.8"
# Locate $XDG_CONFIG_HOME / ~/.config with platform fallbacks.
dirs = "5"
termimad = "0.31"
# Pure-Rust JPEG encoder. Used by camera still/preview paths and
# `screen.snapshot` (RFC-005 v3.2 A3/A4/A8) to produce real JPEG
# byte streams. Tests also use it with synthetic frame buffers so
# receipt encoding is identical across hardware and non-hardware runs.
# Picked over `image` because we only need encoding (no decoders,
# no PNG/GIF/WebP) and want the smallest extra build surface.
jpeg-encoder = { version = "0.7", default-features = false }
# RFC-005 v3.2 A1, A5 — physical audio capture (mic.subscribe) and
# playback (speaker.publish). cpal is the only Rust crate that
# spans CoreAudio + WASAPI + ALSA + PulseAudio with comparable
# maturity; per AXON-RFC-005-device-backend-selection the macOS
# default-device sample-rate may diverge from the schema's
# 16/24/48 kHz set, so a downsampler is added in a follow-up.
cpal = { version = "0.15", optional = true }
# RFC-005 v3.2 A3/A4 — physical camera capture. Non-macOS camera
# subscribe/snapshot uses nokhwa's platform-direct backends. macOS
# snapshot/subscribe use direct AVFoundation bindings below so still
# photos go through `AVCapturePhotoOutput` instead of preview frames.
# `input-native` avoids the heavyweight image-pipeline backends.
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
# RFC-005 v3.2 A4, A8 — physical screen capture
# (screen.subscribe / screen.snapshot). xcap was picked over
# `screenshots` and `scrap` for active maintenance and a usable
# Window/Monitor abstraction (so subject ∈ {display, window,
# application} maps cleanly). On macOS the first call triggers a
# system-modal Screen Recording permission dialog; the handler
# surfaces the permission-denied case as
# reason="resource_unavailable" rather than a panic.
xcap = { version = "0.9", optional = true }
# Remote desktop diagnostic media path. OpenH264 is built into the CLI
# artifact via the crate's source feature, so users do not need ffmpeg or
# any other system encoder installed for baseline H.264 streaming.
openh264 = { version = "0.9", optional = true }
# Remote desktop production media transport. This is Rust-native WebRTC
# signaling/media glue for device-side RTP/SRTP; EasyNet invocation carries
# SDP/ICE only, not desktop media frames.
webrtc = { version = "=0.20.3", optional = true }
rtc = { version = "=0.20.3", optional = true }
toml = "0.8"
toml_edit = "0.23"
# Tokio adopted in PR-7 (Commit 1) as a transitive-to-direct dependency.
# `axon-sdk` already pulls in tokio; this entry adds `sync` + `rt-multi-thread`
# features CLI needs directly for broadcast::channel and multi-thread
# runtime (Commit 2 flips main.rs to #[tokio::main]).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs", "io-util", "time", "net", "signal", "process"] }
tokio-tungstenite = { version = "0.30", features = ["connect"], optional = true }
# tokio-util LengthDelimitedCodec + Framed for IPC frame I/O
# (4-byte LE length prefix + JSON payload). Plan v10.5 §架构决策
# — 本机 IPC 接口.
tokio-util = { version = "0.7", features = ["codec", "rt"] }
# futures stream/sink traits for Framed reader/writer halves.
futures = "0.3"
# bytes::BytesMut backing the codec.
bytes = "1"
ureq = { version = "2", features = ["json"] }
url = { version = "2.5.8", optional = true }
# OpenAPI import accepts both JSON and YAML specifications.
serde_yaml = "0.9"
# Hidden password input for `easynet auth login` when --password
# is omitted. POSIX-only; on Windows rpassword falls back to
# stdin echo. Pinning v7 (matches ratatui's MSRV in the workspace).
rpassword = "7"
# Snapshot renderer for `easynet invocation watch --format panel`.
# We use ratatui's buffer/widget model for deterministic fixed-width
# panels; the watch engine remains the single data source for
# table/json/panel.
ratatui = { version = "0.29", default-features = false }
# Percent-encoding for HTTP-executor URL templating. The `[exec]
# kind = "http"` path encodes substituted values automatically so
# an arg containing a space or non-ASCII char doesn't break the URL.
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
# Cron expression parsing for PR-SCHED. The crate parses
# `0 9 * * *`-style strings into a `Schedule` and computes the
# next-fire instant in a given timezone — minimum surface needed
# for the daemon's tick runner.
cron = "0.12"
# PTY support for fleet.pty_session_* abilities (C-M3b/c). Wraps
# openpty(3) on unix and the ConPTY API on Windows behind one
# trait. Used by the PtyService to spawn child processes attached
# to a real terminal so interactive workloads (REPLs, editors)
# work over the InvokeBidi attach surface. Stays light: portable-pty
# pulls only winapi-rs on Windows and nothing extra on unix beyond
# what tokio already drags in.
portable-pty = "0.8"
# Base64 encoding for binary frame payloads (PTY stdin/stdout).
# JSON can't carry raw bytes, so the bidi attach handler base64-
# encodes both directions. Using base64 (not hex) saves ~33% of
# wire bytes for the throughput-bound terminal output path.
base64 = "0.22"
# thiserror for derive(Error) on internal error enums (e.g. shellguard
# runner). std::error::Error trait derivation by hand is verbose; this
# crate is the de-facto standard.
thiserror = "1"
# tree-sitter + tree-sitter-bash drive the AST stage of the shell.run
# 8-stage pipeline (AXIOM Tier 2.5). Same parser AliveCode uses, so
# the cross-implementation security semantics line up. The parser's
# job is *only* to give shellguard a structured view of a command
# string; everything else (allow/deny, dangerous-pattern detection,
# permission rules) sits in plain Rust on top.
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

# RFC-006-B v0.6 / Pages reference system — HTTP listener.
#  - axum: in-daemon HTTP listener for `*.*.pages.localhost:<port>` (MVP). The
#    Hub-as-agent's `01HUB.pages.serve` ability translates HTTP into
#    `forward_invoke`s onto `<user>.<project>.page.fetch`. Production traffic
#    enters via the Go backend; this listener is dev-only and can be flag-gated.
#  - hyper "server" feature: needed by axum to bind a real TCP socket; pinned
#    explicitly so the daemon's HTTP surface tracks a known hyper version
#    rather than whichever transitive resolution wins.
axum = "0.7"
hyper = { version = "1", features = ["server", "client", "http1"] }
# http-body-util is hyper 1.x's body-collect + Full helper pair.
# Required by the streamable-HTTP MCP transport for collecting
# response bodies and framing request bodies as Full<Bytes>.
http-body-util = "0.1"
# rustls stack for the streamable-HTTP MCP transport's TLS support
# (round-2 of the transport, after SSE landed in round-1). The client
# wraps `TcpStream` with `tokio_rustls::TlsConnector` when the spec's
# url uses `https://`. rustls (not native-tls) keeps the build pure
# Rust — no openssl headers required on the daemon host, which matters
# for Windows/macOS operator-friendly installs. webpki-roots ships
# Mozilla's CA bundle as a const so a stock daemon can connect to
# WAN-hosted MCP servers without per-host CA configuration; operators
# can still override via McpServerSpec.tls.ca_bundle for private CAs.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
# PEM decoder for operator-supplied custom CA bundles (private/internal
# MCP deployments). Used by streamable_http_client when
# McpServerSpec.tls.ca_bundle points at a `.pem` file.
rustls-pemfile = "2"

# RFC-006-B v0.6 / Pages reference system — sandbox + state map.
#  - rustix with `fs` feature: kernel-enforced read sandbox for
#    `<user>.<project>.page.fetch`. Linux uses `openat2(2)` with
#    `RESOLVE_BENEATH | RESOLVE_NO_SYMLINKS | RESOLVE_NO_MAGICLINKS` so path
#    resolution cannot leave the published folder no matter what `..` or
#    symlink games an attacker plays. macOS falls back to realpath+prefix
#    plus O_NOFOLLOW (acknowledged weaker; production targets Linux). v0.6
#    INV-3 (Deterministic Projection) hinges on this sandbox.
rustix = { version = "0.38", features = ["fs"] }
# once_cell::sync::Lazy backs the process-wide PUBLISHED_PROJECTS DashMap
# in the pages reference system. Already transitively present via tonic;
# pinned here so the daemon's surface use is documented (mirrors the
# tokio-stream / tower precedent above).
once_cell = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# The remote invocation adapter uses a tonic UDS client to submit a complete
# signed `InvokeRequest` to the local daemon's Invocation server.
# `tower::service_fn` adapts the `tokio::net::UnixStream` connector
# tonic's `Endpoint::connect_with_connector` accepts; `hyper_util::
# rt::TokioIo` wraps the stream into hyper-compatible IO. Both are
# already in the transitive dep graph via tonic; declared direct
# so the call site in `daemon/invocation/routing/remote_invoke.rs` imports them
# cleanly. Gated to the `axon-pb` feature alongside tonic.
[dependencies.tower]
version = "0.5"
optional = true
[dependencies.hyper-util]
version = "0.1"
optional = true

# Native Apple media dependencies. The objc2 foundation/core crates are
# unconditional on macOS because `camera.snapshot` uses AVFoundation. The
# remote desktop media stack uses ScreenCaptureKit and VideoToolbox through the
# `remote-desktop` feature, which is enabled by default for the product daemon
# and can be omitted only with `--no-default-features` specialist builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = [
    "AVCaptureOutputBase",
    "AVCapturePhotoOutput",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSRunningApplication",
    "libc",
] }
objc2-core-media = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCStream",
    "SCShareableContent",
    "SCError",
    "objc2-core-media",
    "objc2-core-graphics",
    "objc2-core-foundation",
    "block2",
    "dispatch2",
    "libc",
], optional = true }
opus = { version = "0.3.1", optional = true }
objc2-video-toolbox = { version = "0.3", features = [
    "VTCompressionSession",
    "VTCompressionProperties",
    "VTBase",
    "VTErrors",
    "objc2-core-media",
    "objc2-core-video",
], optional = true }

[dev-dependencies]
axon-sdk = { path = "../EasyNet-Axon/sdk/rust" }
# Paused-clock tests (`#[tokio::test(start_paused = true)]`) let the
# invocation-transport reply-deadline tests fire the 60s timer
# instantly instead of sleeping it for real. Test builds only.
tokio = { version = "1", features = ["test-util"] }
# Used by daemon Invocation integration tests to construct a
# `tower::service_fn` connector that adapts a `tokio::net::UnixStream`
# into something tonic's `Endpoint::connect_with_connector` accepts.
# tower itself is already pulled in transitively by tonic; declared
# direct so the e2e test imports it cleanly.
tower = "0.5"
# Used by the same integration fixtures to wrap a `tokio::net::UnixStream` into a
# `hyper`-compatible IO via `hyper_util::rt::TokioIo`. Required by
# tonic 0.12's UDS-over-`connect_with_connector` recipe.
hyper-util = "0.1"

# Tests for the McpClientService spawn a real subprocess against a
# script written into a tempdir; tempfile gives us auto-cleanup so
# a panicked test doesn't leak the dir.
tempfile = "3"

# PR-N1 commit 7/N integration test: generates a self-signed CA +
# leaf cert pair for two daemon binaries to share at test time.
# Dev-only — production daemons receive cert/key paths from
# operator-authored daemon-config.toml. Pinned to 0.13 (the most
# recent line that does not pull in the `aws-lc-rs` cryptographic
# dep, which would require build tooling we don't otherwise need).
rcgen = "0.13"

# Protobuf schema tooling — gated behind `proto-gen` feature.
# Plan v10.5 R1 pins Protobuf as the single source of truth for
# cross-language schemas (Client bindings in Go / Python / Node /
# Swift / Rust / Java all generate from the same .proto files).
# v1 ships the schema files + build script but leaves the call
# sites on hand-rolled JSON structs; enabling `--features
# proto-gen` makes prost-build compile schemas/*.proto into
# target/build/proto/ types that follow-up commits consume.
[dependencies.prost-types]
version = "0.13"
optional = true

[build-dependencies.prost-build]
version = "0.13"
optional = true

# tonic runtime dependency for Invocation server/client plumbing and
# `tonic::Status`. The generated Axon message/stub types now come from
# `axon-sdk/grpc`, not from this crate's build script.
[dependencies.tonic]
version = "0.12"
# `tls-roots` adds the rustls-native-certs probe so dialing
# `https://...` against a publicly-trusted CA (Let's Encrypt,
# DigiCert, etc.) succeeds without an explicit `.tls_config(
# ClientTlsConfig::with_native_roots())` call site. Without it,
# tonic's `Endpoint` has no default trust anchor and every
# unpinned `connect()` fails with an opaque "transport error" —
# the exact symptom that masked the production-WAN issue when
# the hub moved behind nginx with a real LE cert.
features = ["transport", "tls", "tls-roots"]
optional = true
