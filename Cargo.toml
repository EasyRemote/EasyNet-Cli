[package]
name = "easynet"
version = "1.22.18"
edition = "2021"
description = "EasyNet CLI + Hub MCP server + EAL (EasyNet Ability Language)."
license = "Apache-2.0"
build = "build.rs"

[features]
# Compile schemas/*.proto into Rust types via prost-build. Off by
# default in v1 so developers without protoc installed can still
# build the CLI; feature gate flips on once the proto-generated
# types start being consumed. v10.5 R1 PR-DAEMON ships the .proto
# files and the toolchain wiring, but does NOT flip any call site
# to use the generated types (that is a follow-up commit / PR-SYS).
proto-gen = ["dep:prost", "dep:prost-types", "dep:prost-build"]

# Compile axon `axon/v1/*.proto` into a `pb` module exposing the
# tonic server-side `Invocation` trait that RFC-003 PR-1 implements.
# Off by default — daemon-side `axon_serve` module gates its build on
# this feature to keep the no-protoc developer path working. Pulls in
# tonic-build (build) + tonic + prost (runtime).
axon-pb = [
    "dep:tonic",
    "dep:prost",
    "dep:prost-types",
    "dep:tonic-build",
    "dep:prost-build",
]

# v10.5 R1 (PR-DAEMON): split historical binary-only crate into a
# library + multiple bins. The library target carries all the
# business modules and (future) C ABI exports; bins are thin entry
# points linking the library.
#
#  - rlib      — Rust-to-Rust internal linking (bins in this crate)
#  - cdylib    — shared library for C FFI callers (Go/Python/Swift/...)
#  - staticlib — static archive for platforms preferring static link (iOS)
#
# `dylib` deliberately excluded: it carries Rust symbol mangling;
# goal is a stable C ABI, not a stable Rust ABI.
[lib]
name = "easynet_cli"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "easynet"
path = "src/bin/easynet.rs"

# Long-running daemon. Owns pair/heartbeat/Axon-node-identity today;
# follow-up PRs in the v10.5 R1 series (PR-SYS / PR-ATTACH / PR-PERM
# / PR-DISCUSS / PR-SCHED / PR-LOOP) extend it with the local IPC
# server, schedule tick, and system.* ability publisher. `easynet
# self control start/stop/status` supervises this bin's PID.
[[bin]]
name = "easynet-daemon"
path = "src/bin/easynet-daemon.rs"

# Maintainer tool. Regenerates every abilities/system/<name>.ability.toml
# descriptor from the live `published_abilities()` metadata. Run after
# any change to a `description_*` / `input_schema_*` function; the
# `every_published_ability_has_a_toml_byte_for_byte_matching_the_renderer`
# test in src/runtime/agents/mod.rs fails CI if the on-disk TOML
# drifts from what this binary would emit.
#
#   cargo run --bin gen-ability-tomls
[[bin]]
name = "gen-ability-tomls"
path = "src/bin/gen-ability-tomls.rs"

[[bin]]
name = "real-user-smoke"
path = "src/bin/real-user-smoke.rs"

[[bin]]
name = "real-publish-smoke"
path = "src/bin/real-publish-smoke.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
console = "0.15"
crossbeam-queue = "0.3"
ctrlc = "3"
# Concurrent shard-locked map. PresenceRegistry (RFC-003 PR-1 spec §3)
# uses one DashMap<device_uri, DispatchSender> with shard count
# tuned via `with_shard_amount(num_cpus * 4)`. The full feature
# justification — bounded backpressure, shard-locked sub-millisecond
# lookups across thousands of devices — is documented in
# `services/presence_registry.rs` module docs.
dashmap = "6"
# tokio-stream wrappers used by RFC-003 PR-1:
#  - `sync` feature: BroadcastStream for the
#    `federation.subscribe_directory` server-stream pump (spec §4)
#  - `net` feature: UnixListenerStream so the daemon binary's
#    gRPC InvocationServer can serve over UDS via
#    `Server::serve_with_incoming(...)` (spec §1.1 — daemon.sock)
# Promoted from a transitive dep (already pulled in via tonic) to a
# direct dep so the daemon's surface use is documented in Cargo.toml.
tokio-stream = { version = "0.1", features = ["sync", "net"] }
easynet-axon = { path = "../EasyNet-Axon/sdk/rust" }
# Skill-install adapter needs tarball extraction + hex encoding of
# the content_hash digest. Kept as direct deps (not via easynet-axon)
# because the skill subcommand is self-contained.
flate2 = "1"
gethostname = "0.5"
hex = "0.4"
tar = "0.4"
indicatif = "0.17"
num_cpus = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Used by `runtime::publish::derive_owner_public_key_b64` to mirror
# the SDK's deterministic key derivation — the daemon must pass the
# runtime the SAME key the bridge will later sign under, or
# `verify_easynet_subject_key_binding` rejects every Invoke. Version
# pinned to match the SDK's transitive use.
ed25519-dalek = "2"
# RFC-002 keyring: AES-GCM encrypts private keys at rest under a master
# key derived from OS keychain (preferred) or passphrase (fallback).
aes-gcm = "0.10"
# Argon2id KDF for passphrase-fallback master key derivation.
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc", "password-hash"] }
# CSPRNG for keypair generation, AES-GCM nonces, master-key salts.
rand = "0.8"
# Locate $XDG_CONFIG_HOME / ~/.config with platform fallbacks.
dirs = "5"
termimad = "0.31"
# Pure-Rust JPEG encoder. Used by `camera.snapshot` /
# `screen.snapshot` (RFC-005 v3.2 A3 / A8) to produce a real JPEG
# byte stream. PR3a uses it with a synthetic frame buffer (no
# hardware dep — the real cpal/nokhwa backends land later); the
# encode path itself is the same for synthetic and real frames.
# Picked over `image` because we only need encoding (no decoders,
# no PNG/GIF/WebP) and want the smallest extra build surface.
jpeg-encoder = { version = "0.7", default-features = false }
# RFC-005 v3.2 A1, A5 — physical audio capture (mic.subscribe) and
# playback (speaker.publish). cpal is the only Rust crate that
# spans CoreAudio + WASAPI + ALSA + PulseAudio with comparable
# maturity; per AXON-RFC-005-device-backend-selection the macOS
# default-device sample-rate may diverge from the schema's
# 16/24/48 kHz set, so a downsampler is added in a follow-up.
cpal = "0.15"
# RFC-005 v3.2 A2, A3 — physical camera capture
# (camera.subscribe / camera.snapshot). nokhwa wraps AVFoundation
# (macOS), V4L2 (Linux) and MediaFoundation (Windows). Windows
# back-end is known fragile; only macOS + Linux land in CI.
# `input-native` opts into the platform-direct backends and
# avoids the heavyweight image-pipeline backends.
nokhwa = { version = "0.10", features = ["input-native"] }
# RFC-005 v3.2 A4, A8 — physical screen capture
# (screen.subscribe / screen.snapshot). xcap was picked over
# `screenshots` and `scrap` for active maintenance and a usable
# Window/Monitor abstraction (so subject ∈ {display, window,
# application} maps cleanly). On macOS the first call triggers a
# system-modal Screen Recording permission dialog; the handler
# surfaces the permission-denied case as
# reason="resource_unavailable" rather than a panic.
xcap = "0.9"
toml = "0.8"
toml_edit = "0.23"
# Tokio adopted in PR-7 (Commit 1) as a transitive-to-direct dependency.
# `easynet-axon` already pulls in tokio; this entry adds `sync` + `rt-multi-thread`
# features CLI needs directly for broadcast::channel and multi-thread
# runtime (Commit 2 flips main.rs to #[tokio::main]).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs", "io-util", "time", "net", "signal", "process"] }
# tokio-util LengthDelimitedCodec + Framed for IPC frame I/O
# (4-byte LE length prefix + JSON payload). Plan v10.5 §架构决策
# — 本机 IPC 接口.
tokio-util = { version = "0.7", features = ["codec", "rt"] }
# futures stream/sink traits for Framed reader/writer halves.
futures = "0.3"
# bytes::BytesMut backing the codec.
bytes = "1"
ureq = { version = "2", features = ["json"] }
# Percent-encoding for HTTP-executor URL templating. The `[exec]
# kind = "http"` path encodes substituted values automatically so
# an arg containing a space or non-ASCII char doesn't break the URL.
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
# Cron expression parsing for PR-SCHED. The crate parses
# `0 9 * * *`-style strings into a `Schedule` and computes the
# next-fire instant in a given timezone — minimum surface needed
# for the daemon's tick runner.
cron = "0.12"
# PTY support for fleet.pty_session_* abilities (C-M3b/c). Wraps
# openpty(3) on unix and the ConPTY API on Windows behind one
# trait. Used by the PtyService to spawn child processes attached
# to a real terminal so interactive workloads (REPLs, editors)
# work over the InvokeBidi attach surface. Stays light: portable-pty
# pulls only winapi-rs on Windows and nothing extra on unix beyond
# what tokio already drags in.
portable-pty = "0.8"
# Base64 encoding for binary frame payloads (PTY stdin/stdout).
# JSON can't carry raw bytes, so the bidi attach handler base64-
# encodes both directions. Using base64 (not hex) saves ~33% of
# wire bytes for the throughput-bound terminal output path.
base64 = "0.22"
# thiserror for derive(Error) on internal error enums (e.g. shellguard
# runner). std::error::Error trait derivation by hand is verbose; this
# crate is the de-facto standard.
thiserror = "1"
# tree-sitter + tree-sitter-bash drive the AST stage of the shell.run
# 8-stage pipeline (AXIOM Tier 2.5). Same parser AliveCode uses, so
# the cross-implementation security semantics line up. The parser's
# job is *only* to give shellguard a structured view of a command
# string; everything else (allow/deny, dangerous-pattern detection,
# permission rules) sits in plain Rust on top.
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Tests for the McpClientService spawn a real subprocess against a
# script written into a tempdir; tempfile gives us auto-cleanup so
# a panicked test doesn't leak the dir.
tempfile = "3"

# Protobuf schema tooling — gated behind `proto-gen` feature.
# Plan v10.5 R1 pins Protobuf as the single source of truth for
# cross-language schemas (Client bindings in Go / Python / Node /
# Swift / Rust / Java all generate from the same .proto files).
# v1 ships the schema files + build script but leaves the call
# sites on hand-rolled JSON structs; enabling `--features
# proto-gen` makes prost-build compile schemas/*.proto into
# target/build/proto/ types that follow-up commits consume.
[dependencies.prost]
version = "0.13"
optional = true

[dependencies.prost-types]
version = "0.13"
optional = true

[build-dependencies.prost-build]
version = "0.13"
optional = true

# tonic-build generates the server-side `Invocation` trait + types
# from `axon/v1/*.proto` under the `axon-pb` feature. Path resolution
# in build.rs is `../EasyNet-Axon/core/runtime-rs/client-sdk/proto` —
# the same path the EasyNet-Federation-MVP `common/build.rs` uses;
# kept consistent so the two crates compile against bytewise-identical
# proto sets. RFC-003 spec §0 forbids modifying axon repo, and this
# build-system entry honours that — we read the canonical .proto only.
[build-dependencies.tonic-build]
version = "0.12"
optional = true

# tonic runtime dependency for the generated Invocation server +
# tonic::Status etc. Only needed when `axon-pb` is on.
[dependencies.tonic]
version = "0.12"
features = ["transport", "tls"]
optional = true
