schema_version = "2"
name = "invocation.record.get"
descriptor_version = "1.0.0"
description = "Observe one invocation ledger record by request_id or canonical ledger key."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":true,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false
anyOf = [{ required = ["request_id"] }, { required = ["key"] }]

[input_schema.properties.filter]
type = "object"
additionalProperties = false

[input_schema.properties.filter.properties.ability_ura]
type = "string"
description = "Canonical Ability URA."

[input_schema.properties.filter.properties.ability_uras]
type = "array"
items = { minLength = 1, type = "string" }
description = "Canonical Ability URAs. Records match when ability_ura equals any value."
minItems = 1
uniqueItems = true

[input_schema.properties.filter.properties.agent_ura]
type = "string"
description = "Ability owner/callee Agent URA. Equivalent to callee_ura for history scope."

[input_schema.properties.filter.properties.callee_ura]
type = "string"
description = "Callee/owner Agent URA."

[input_schema.properties.filter.properties.caller_ura]
type = "string"
description = "Caller Agent URA."

[input_schema.properties.filter.properties.state]
type = "string"

[input_schema.properties.filter.properties.subject_ura]
type = "string"
description = "Single subject URA."

[input_schema.properties.filter.properties.subject_uras]
type = "array"
items = { minLength = 1, type = "string" }
description = "OR-scope over subject URAs."
minItems = 1
uniqueItems = true

[input_schema.properties.filter.properties.trace_id]
type = "string"

[input_schema.properties.key]
type = "object"
additionalProperties = false
maxProperties = 1
minProperties = 1

[input_schema.properties.key.properties.request_id]
type = "string"

[input_schema.properties.key.properties.trace_id]
type = "string"

[input_schema.properties.key.properties.ura]
type = "string"
description = "Invocation URA."

[input_schema.properties.request_id]
type = "string"
minLength = 1
