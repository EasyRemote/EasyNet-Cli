schema_version = "2"
name = "meta.teach"
descriptor_version = "1.0.0"
description = "Grant one local agent permission to import a specific advertised ability descriptor. The grant is explicit, same-device, and does not install executable code."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["ability", "learner_ura"]
additionalProperties = false

[input_schema.properties.ability]
type = "string"
description = "Owner-local ability descriptor name to grant, for example mentor.quote."

[input_schema.properties.learner_ura]
type = "string"
description = "Agent URA allowed to import the descriptor."
