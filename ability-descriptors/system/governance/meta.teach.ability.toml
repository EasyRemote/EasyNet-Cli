schema_version = "1"
name = "meta.teach"
description = "Grant one local agent permission to import a specific advertised ability descriptor. The grant is explicit, same-device, and does not install executable code."

[input_schema]
type = "object"
required = ["ability", "learner_ura"]
additionalProperties = false

[input_schema.properties.ability]
type = "string"
description = "Owner-local ability descriptor name to grant, for example mentor.quote."

[input_schema.properties.learner_ura]
type = "string"
description = "Agent URA allowed to import the descriptor."
