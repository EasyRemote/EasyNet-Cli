schema_version = "3"
name = "invocation.history.list"
descriptor_version = "1.0.0"
description = "List bounded summaries of recent invocation ledger records for this runtime owner. Fetch one record through invocation.history.get for payload, diagnostic, causal, visibility, and receipt details."
exposure = "operator"
dedicated_surface = "none"
subject_contract_kind = "explicit-ura"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":true,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.compact]
type = "boolean"
description = "Accepted for request compatibility. List records are always bounded summaries; use invocation.history.get for complete records."
deprecated = true

[input_schema.properties.cursor]
type = "string"
description = "Opaque receipt history cursor returned by the previous invocation.history.list page."
minLength = 1
maxLength = 4096

[input_schema.properties.exclude_ability_uras]
type = "array"
items = { minLength = 1, type = "string" }

[input_schema.properties.filter]
type = "object"
additionalProperties = false

[input_schema.properties.filter.properties.ability_ura]
type = "string"
description = "Canonical Ability URA."

[input_schema.properties.filter.properties.ability_uras]
type = "array"
items = { minLength = 1, type = "string" }
description = "Canonical Ability URAs. Records match when ability_ura equals any value."
minItems = 1
uniqueItems = true

[input_schema.properties.filter.properties.callee_ura]
type = "string"
description = "Callee principal URA."

[input_schema.properties.filter.properties.caller_ura]
type = "string"
description = "Caller Agent URA."

[input_schema.properties.filter.properties.state]
type = "string"

[input_schema.properties.filter.properties.subject_ura]
type = "string"
description = "Single subject URA."

[input_schema.properties.filter.properties.subject_uras]
type = "array"
items = { minLength = 1, type = "string" }
description = "OR-scope over subject URAs."
minItems = 1
uniqueItems = true

[input_schema.properties.filter.properties.trace_id]
type = "string"

[input_schema.properties.include_attempts]
type = "boolean"
description = "When true, include pre-runtime invocation attempts and row diagnostics for UI history views."

[input_schema.properties.key]
type = "object"
additionalProperties = false
maxProperties = 1
minProperties = 1

[input_schema.properties.key.properties.request_id]
type = "string"

[input_schema.properties.key.properties.trace_id]
type = "string"

[input_schema.properties.key.properties.ura]
type = "string"
description = "Invocation URA."

[input_schema.properties.limit]
type = "integer"
minimum = 1
maximum = 500
