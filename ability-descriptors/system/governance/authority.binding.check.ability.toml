[input_schema.properties.owner_source]
type = "string"

[input_schema.properties.owner_ura]
type = "string"

[input_schema.properties.owner_user_id]
type = "string"

[input_schema.properties.principal_id]
type = "string"

[input_schema.properties.principal_kind]
type = "string"

[input_schema.properties.principal_ura]
type = "string"

[input_schema.properties.rejector_ura]
type = "string"

