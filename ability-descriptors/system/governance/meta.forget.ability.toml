schema_version = "3"
name = "meta.forget"
descriptor_version = "1.0.0"
description = "Remove an imported declaration-only descriptor from an agent workspace. Native authored abilities are not removed through this surface."
exposure = "internal"
dedicated_surface = "none"
subject_contract_kind = "route-target"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["ability", "agent"]
additionalProperties = false

[input_schema.properties.ability]
type = "string"
description = "Public imported descriptor name to remove from the agent workspace."

[input_schema.properties.agent]
type = "string"
description = "Local agent name that previously imported the descriptor."
