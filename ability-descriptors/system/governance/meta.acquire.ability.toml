schema_version = "3"
name = "meta.acquire"
descriptor_version = "1.0.0"
description = "Import a previously granted declaration-only ability manifest into a learner agent workspace. The imported descriptor is discoverable but not invokable."
exposure = "internal"
dedicated_surface = "none"
subject_contract_kind = "route-target"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["ability_ura", "learner"]
additionalProperties = false

[input_schema.properties.ability_ura]
type = "string"
description = "Canonical Ability URA whose declaration manifest was granted to the learner."

[input_schema.properties.learner]
type = "string"
description = "Local learner agent name whose workspace receives the descriptor copy."
