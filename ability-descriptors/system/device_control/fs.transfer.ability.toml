schema_version = "3"
name = "fs.transfer"
descriptor_version = "1.0.0"
description = "Bidirectional file transfer between the operator and this device's filesystem through a revalidated RFC-005 filesystem ResourceRef. mode=\"upload\" requires write capability and streams client→file with atomic commit, explicit overwrite, and expected size/SHA-256 verification; mode=\"download\" requires read capability and streams file→client with on-the-fly hashing. Per-call byte cap 1 GiB."
exposure = "task"
dedicated_surface = "file_transfer"
subject_contract_kind = "dedicated-surface"
call_mode = "bidi"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":true}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["mode", "resource_ref"]
additionalProperties = false

[input_schema.properties.expected_bytes]
type = "integer"
minimum = 0

[input_schema.properties.expected_sha256]
type = "string"
pattern = "^[0-9a-fA-F]{64}$"

[input_schema.properties.max_bytes]
type = "integer"
minimum = 1
maximum = 1073741824

[input_schema.properties.mode]
type = "string"
enum = ["upload", "download"]

[input_schema.properties.overwrite]
type = "boolean"

[input_schema.properties.resource_ref]
type = "object"
required = ["resource_ura", "owner_ura", "namespace", "capability", "expires_unix_ms", "revision"]
additionalProperties = false

[input_schema.properties.resource_ref.properties.capability]
type = "string"
enum = ["list", "stat", "read", "write"]

[input_schema.properties.resource_ref.properties.display_path]
type = "string"

[input_schema.properties.resource_ref.properties.expires_unix_ms]
type = "integer"

[input_schema.properties.resource_ref.properties.namespace]
type = "string"
enum = ["fs"]

[input_schema.properties.resource_ref.properties.owner_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.resource_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.revision]
type = "string"
minLength = 1
