schema_version = "3"
name = "shell.run"
descriptor_version = "1.0.0"
description = "Run a bash command string through the AXIOM Tier 2.5 8-stage security pipeline (empty / pre-check / AST / security catalogue / permission rules / path constraints / read-only classifier / destructive list) before dispatching to bash -c. Part of the baseline-locomotion-v1 profile."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["command"]
additionalProperties = false

[input_schema.properties.allow_rules]
type = "array"
items = { properties = { argv0 = { type = "string" }, flags = { items = { type = "string" }, type = "array" }, match = { enum = ["exact", "prefix"], type = "string" } }, required = ["argv0"], type = "object" }

[input_schema.properties.command]
type = "string"
minLength = 1

[input_schema.properties.cwd]
type = "string"

[input_schema.properties.deny_rules]
type = "array"
items = { properties = { argv0 = { type = "string" }, flags = { items = { type = "string" }, type = "array" }, match = { enum = ["exact", "prefix"], type = "string" } }, required = ["argv0"], type = "object" }

[input_schema.properties.destructive_acknowledged]
type = "boolean"

[input_schema.properties.env]
type = "object"
additionalProperties = { type = "string" }

[input_schema.properties.output_max_bytes]
type = "integer"
minimum = 0
maximum = 104857600

[input_schema.properties.read_only_only]
type = "boolean"

[input_schema.properties.sandbox]
type = "boolean"

[input_schema.properties.stdin]
oneOf = [{ type = "string" }, { items = { maximum = 255, minimum = 0, type = "integer" }, type = "array" }, { type = "null" }]

[input_schema.properties.stdin_encoding]
type = "string"
enum = ["base64", "utf8"]

[input_schema.properties.timeout_ms]
type = "integer"
minimum = 0
maximum = 3600000

[input_schema.properties.write_allowed_roots]
type = "array"
items = { type = "string" }
