schema_version = "2"
name = "terminal.input"
descriptor_version = "1.0.0"
description = "Push base64-encoded stdin bytes into a PTY session. Pairs with terminal.read to form the unary RPC data plane used by the EasyNet backend's PTYDriver."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["session_id", "data"]
additionalProperties = false

[input_schema.properties.data]
type = "string"
description = "base64-encoded stdin bytes"

[input_schema.properties.session_id]
type = "string"
minLength = 1
