schema_version = "3"
name = "fs.edit"
descriptor_version = "1.0.0"
description = "Surgical string-replace edit on a single text file through a revalidated RFC-005 filesystem ResourceRef. Default contract: old_string MUST occur exactly once; ambiguous matches reject with the count rather than silently rewriting all occurrences. Pass replace_all=true to opt into bulk replacement. File size capped at 1 GiB. Atomic write via tempfile + fdatasync + rename. Part of the baseline-locomotion-v1 profile (AXIOM §Tier 2.5)."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["resource_ref", "old_string", "new_string"]
additionalProperties = false

[input_schema.properties.expected_mtime_ms]
type = "integer"
description = "Optional staleness guard. Caller asserts the target's mtime (ms since UNIX epoch) matches the value last seen. Receiver stats the file before editing and rejects with StaleMtime if the actual mtime differs."
minimum = 0

[input_schema.properties.new_string]
type = "string"
description = "Replacement substring."

[input_schema.properties.old_string]
type = "string"
description = "Exact substring to find. Empty string + non-existent file = create-new-file with new_string as content."

[input_schema.properties.replace_all]
type = "boolean"
description = "When true, replace every occurrence; receipt records match_count. When false (default), the call rejects with AmbiguousMatch unless old_string occurs exactly once."

[input_schema.properties.resource_ref]
type = "object"
required = ["resource_ura", "owner_ura", "namespace", "capability", "expires_unix_ms", "revision"]
additionalProperties = false

[input_schema.properties.resource_ref.properties.capability]
type = "string"
enum = ["list", "stat", "read", "write"]

[input_schema.properties.resource_ref.properties.display_path]
type = "string"

[input_schema.properties.resource_ref.properties.expires_unix_ms]
type = "integer"

[input_schema.properties.resource_ref.properties.namespace]
type = "string"
enum = ["fs"]

[input_schema.properties.resource_ref.properties.owner_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.resource_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.revision]
type = "string"
minLength = 1
