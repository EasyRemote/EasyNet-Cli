schema_version = "2"
name = "browser.capture_viewport"
descriptor_version = "1.0.0"
description = "[V0 MOCK — RETURNS A 1x1 PLACEHOLDER FRAME, NOT REAL VIEWPORT CONTENT; replaced by real capture in RFC-013 W2] Stream webp/png/jpeg viewport frames from an open WebView session. Streaming ability — each emitted frame carries `bytes_base64` + `encoding` + viewport dimensions + monotonic `sequence`. v0 emits a single placeholder webp frame so the frontend canvas pipeline can be exercised end-to-end; RFC-013 swaps the mock for real per-platform capture."
call_mode = "stream"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":true,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["session_ura"]
additionalProperties = false

[input_schema.properties.encoding]
type = "string"
enum = ["png", "webp", "jpeg"]
description = "Output image encoding. Default 'webp'."

[input_schema.properties.quality]
type = "integer"
description = "Encoder quality for lossy formats. Default 75."
minimum = 1
maximum = 100

[input_schema.properties.session_ura]
type = "string"
description = "Session URA returned by browser.open_session."
minLength = 1
