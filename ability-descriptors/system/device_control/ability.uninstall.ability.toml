schema_version = "2"
name = "ability.uninstall"
descriptor_version = "1.0.0"
description = "Uninstall an ability from a canonical host Device URA. The accountable User invokes the target Device's ability-management SystemAgent with the removed Ability URA as subject; the Device remains execution host/custody only. The target removes the durable row, runtime binding, and control-plane record as one lifecycle transition."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "only_ura_kinds"
scope_subjects_uras = ["ability"]
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":true,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["ability_ura", "target_ura"]
additionalProperties = false

[input_schema.properties.ability_ura]
type = "string"

[input_schema.properties.install_id]
type = "string"

