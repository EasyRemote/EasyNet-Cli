schema_version = "2"
name = "ability.publish"
descriptor_version = "1.0.0"
description = "Publish a new ability into a registered agent's abilities/ directory. The ability becomes visible to the next discover scan. Refuses to overwrite an existing ability; call ability.unpublish first to replace."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["owner_ura", "manifest_toml"]

[input_schema.properties.manifest_toml]
type = "string"
description = "Full ability.toml body. The file stem on disk is taken from the manifest's `name` field."

[input_schema.properties.owner_ura]
type = "string"
description = "Canonical Agent URA whose abilities/ dir receives the manifest. Its agent id must be registered locally."
