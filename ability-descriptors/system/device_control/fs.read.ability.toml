schema_version = "3"
name = "fs.read"
descriptor_version = "1.0.0"
description = "Read a file through a revalidated filesystem ResourceRef (streamed up to max_bytes, default 8 MiB, hard cap 100 MiB). With encoding=\"utf8\" the optional offset_lines / limit_lines pair selects a 1-based line window. Blocked-device paths (/dev/{zero,random,urandom,stdin,stdout,tty}, /proc/self/fd/{0,1,2}) reject. Part of the baseline-locomotion-v1 profile (AXIOM §Tier 2.5)."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["resource_ref"]
additionalProperties = false

[input_schema.properties.encoding]
type = "string"
enum = ["binary", "utf8"]

[input_schema.properties.limit_lines]
type = "integer"
description = "Maximum lines to return after offset_lines. Requires encoding=\"utf8\"."
minimum = 0

[input_schema.properties.max_bytes]
type = "integer"
description = "Per-call read cap. Default 8 MiB, hard cap 100 MiB. Read is streamed up to this cap; multi-GB paths cannot OOM the receiver."
minimum = 0
maximum = 104857600

[input_schema.properties.offset_lines]
type = "integer"
description = "1-based starting line. Requires encoding=\"utf8\". 0 returns empty deterministically."
minimum = 0

[input_schema.properties.resource_ref]
type = "object"
required = ["resource_ura", "owner_ura", "namespace", "capability", "expires_unix_ms", "revision"]
additionalProperties = false

[input_schema.properties.resource_ref.properties.capability]
type = "string"
enum = ["list", "stat", "read", "write"]

[input_schema.properties.resource_ref.properties.display_path]
type = "string"

[input_schema.properties.resource_ref.properties.expires_unix_ms]
type = "integer"

[input_schema.properties.resource_ref.properties.namespace]
type = "string"
enum = ["fs"]

[input_schema.properties.resource_ref.properties.owner_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.resource_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.revision]
type = "string"
minLength = 1
