schema_version = "2"
name = "session.attach"
descriptor_version = "1.0.0"
description = "Subscribe to a session's TimelineEvent stream. Replays from `since_seq` (default 0) on disk, then tails live events. Terminates when the session reaches a terminal state."
call_mode = "stream"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":true,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["session_id"]
additionalProperties = false

[input_schema.properties.session_id]
type = "string"

[input_schema.properties.since_seq]
type = "integer"
minimum = 0
