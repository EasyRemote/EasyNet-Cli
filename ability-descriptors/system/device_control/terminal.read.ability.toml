schema_version = "2"
name = "terminal.read"
descriptor_version = "1.0.0"
description = "Drain a PTY session's stdout up to a timeout. Returns base64 bytes; sets `code: \"session_dead\"` once the child has exited and the buffer is fully drained."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["session_id"]
additionalProperties = false

[input_schema.properties.session_id]
type = "string"
minLength = 1

[input_schema.properties.timeout]
type = "number"
description = "seconds to wait for output before returning empty"
minimum = 0
maximum = 60.0
