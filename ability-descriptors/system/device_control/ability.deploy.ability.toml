schema_version = "3"
name = "ability.deploy"
descriptor_version = "1.0.0"
description = "Deploy a host_stream ability bundle ResourceRef through the device-sponsored ability-management SystemAgent, which owns the deployed public descriptor. The target Device is execution host/custody only, not descriptor owner or public callee. A local target validates the manifest, durably installs it, binds the runtime, and registers the control-plane record. Remote CLI deploy stages a tar.gz bundle into the target Device resource plane before invoking this ability on its ability-management SystemAgent; this handler still rejects attempts to mutate a non-local target directly. Shell and arbitrary host-command exec kinds are rejected until a permission broker exists."
exposure = "operator"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "only_ura_kinds"
scope_subjects_uras = ["resource"]
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["resource_ref", "target_ura"]
additionalProperties = false

[input_schema.properties.binding_lease_ms]
type = "integer"
minimum = 1000
maximum = 300000

[input_schema.properties.resource_ref]
type = "object"
required = ["resource_ura", "owner_ura", "namespace", "capability", "expires_unix_ms", "revision"]
additionalProperties = false

[input_schema.properties.resource_ref.properties.capability]
type = "string"
enum = ["list", "stat", "read", "write"]

[input_schema.properties.resource_ref.properties.display_path]
type = "string"

[input_schema.properties.resource_ref.properties.expires_unix_ms]
type = "integer"

[input_schema.properties.resource_ref.properties.namespace]
type = "string"
enum = ["fs"]

[input_schema.properties.resource_ref.properties.owner_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.resource_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.revision]
type = "string"
minLength = 1

[input_schema.properties.target_ura]
type = "string"
