schema_version = "3"
name = "fs.write"
descriptor_version = "1.0.0"
description = "Write a revalidated filesystem ResourceRef atomically (temp + rename). Part of the baseline-locomotion-v1 profile (AXIOM §Tier 2.5)."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "route-target"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["resource_ref", "content"]
additionalProperties = false

[input_schema.properties.content]
oneOf = [{ description = "base64-encoded by default; pass encoding=\"utf8\" for raw text", type = "string" }, { items = { maximum = 255, minimum = 0, type = "integer" }, type = "array" }]

[input_schema.properties.create_parents]
type = "boolean"

[input_schema.properties.encoding]
type = "string"
enum = ["base64", "utf8"]

[input_schema.properties.expected_mtime_ms]
type = "integer"
description = "Optional staleness guard. Caller asserts the target's mtime (milliseconds since UNIX epoch) matches the value last seen. Receiver stats the file before writing and rejects if the actual mtime differs (or the file does not exist). Stateless equivalent of FileWriteTool's read-before-write check; the caller passes the mtime they captured from the most recent fs.read of the same path."
minimum = 0

[input_schema.properties.mode]
type = "integer"
description = "Unix permission bits. When set, the caller wins. When unset and the target file already exists, the receiver preserves the target's existing mode. When unset and the target is new, falls back to umask default."
minimum = 0

[input_schema.properties.resource_ref]
type = "object"
required = ["resource_ura", "owner_ura", "namespace", "capability", "expires_unix_ms", "revision"]
additionalProperties = false

[input_schema.properties.resource_ref.properties.capability]
type = "string"
enum = ["list", "stat", "read", "write"]

[input_schema.properties.resource_ref.properties.display_path]
type = "string"

[input_schema.properties.resource_ref.properties.expires_unix_ms]
type = "integer"

[input_schema.properties.resource_ref.properties.namespace]
type = "string"
enum = ["fs"]

[input_schema.properties.resource_ref.properties.owner_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.resource_ura]
type = "string"
minLength = 1

[input_schema.properties.resource_ref.properties.revision]
type = "string"
minLength = 1
