schema_version = "3"
name = "ability.unpublish"
descriptor_version = "1.0.0"
description = "Remove an ability from an agent's abilities/ directory. Hard delete; the daemon log records the deleted manifest's content hash so the body can be recovered from a backup if needed. Reserved verbs (e.g. `chat`) cannot be deleted via this surface."
exposure = "operator"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":true,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["ability_ura"]

[input_schema.properties.ability_ura]
type = "string"
description = "Canonical agent-owned Ability URA to delete. Its agent id must be registered locally and its public name must NOT be reserved (e.g. `chat`)."
