schema_version = "2"
name = "loop.create"
descriptor_version = "1.0.0"
description = "Create a worker+verify loop instance bounded by max_iters. The daemon immediately starts the per-loop controller, which drives body and verify Invocations through Kernel::invoke until a terminal state is reached."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["worker_agent", "max_iters"]
additionalProperties = false

[input_schema.properties.body_prompt]
type = "string"

[input_schema.properties.max_iters]
type = "integer"
minimum = 1

[input_schema.properties.verify_expr]
type = "string"

[input_schema.properties.worker_agent]
type = "string"
