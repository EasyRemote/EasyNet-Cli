schema_version = "3"
name = "mission.track"
descriptor_version = "1.0.0"
description = "Read the persisted state of a prior `easynet.run` invocation by run id. Returns the same shape `easynet.run` surfaces (run_id, run_dir, outputs, meta, ok) reconstructed from the on-disk run dir. Use it to poll a long-running mission without holding the original RPC open."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "explicit-ura"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":true,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["run_id"]
additionalProperties = false

[input_schema.properties.run_id]
type = "string"
description = "The run id returned by an earlier `easynet.run` call (the trailing component of run_dir)."
