schema_version = "3"
name = "loop.subscribe"
descriptor_version = "1.0.0"
description = "Subscribe to a loop's status stream. Replays any buffered per-iteration frames, then tails live IterStarted / BodyChunk / VerifyChunk / IterFinished / Terminal frames while the loop is running."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "stream"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":true,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["loop_id"]
additionalProperties = false

[input_schema.properties.loop_id]
type = "string"
