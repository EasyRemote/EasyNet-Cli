schema_version = "2"
name = "mission.cancel"
descriptor_version = "1.0.0"
description = "Mark an in-flight mission run as cancelled. Best-effort: rewrites the run's meta.json to status=cancelled and removes the pid file; long-running step subprocesses are NOT killed today, they just stop being awaited. Returns `cancelled = false` (with informative meta) if the run was already terminal."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["run_id"]
additionalProperties = false

[input_schema.properties.run_id]
type = "string"
description = "The run id of the mission to cancel."
