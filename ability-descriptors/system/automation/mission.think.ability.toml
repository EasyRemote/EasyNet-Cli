schema_version = "3"
name = "mission.think"
descriptor_version = "1.0.0"
description = "Run a long-running task with a separate judge session. Each cycle: the worker session resumes its prior session_id and pushes the task forward; an independent judge session reads the worker's latest output, decides whether to terminate, and emits a memory- classification verdict (which Phase 5's curator turns into ability.publish or skill.publish)."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "explicit-ura"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["owner_agent_id", "prompt"]

[input_schema.properties.judge_agent_id]
type = "string"
description = "Optional. The judge agent. Defaults to owner_agent_id; the *sessions* are independent regardless."

[input_schema.properties.max_cycles]
type = "integer"
description = "Hard cap on worker+judge cycles. Default 5, ceiling HARD_MAX_CYCLES (50)."
minimum = 1

[input_schema.properties.owner_agent_id]
type = "string"
description = "The worker agent. Its `<agent>.chat` ability is invoked once per cycle with cross-session resume."

[input_schema.properties.prompt]
type = "string"
description = "The initial task description for the worker. Cycle 1 sees this verbatim; cycles 2+ see a continue-hint, with the prior session_id rehydrating context."
