schema_version = "1"
name = "a2a.client.send_task"
description = "Outbound A2A: dispatch a signed descriptor-bound RPC Invoke against a remote node's `<agent_name>.<skill_name>` ability through the daemon's canonical Invocation service. Returns {ok:true,result} on success; remote failures surface as {ok:false,error}. The `args` payload remains opaque to the routing layer."

[input_schema]
type = "object"
required = ["target_node_ura", "agent_name", "skill_name"]
additionalProperties = false

[input_schema.properties.agent_name]
type = "string"
minLength = 1

[input_schema.properties.args]
description = "Free-form per-skill args; shape per the remote skill's input_schema."

[input_schema.properties.skill_name]
type = "string"
minLength = 1

[input_schema.properties.target_node_ura]
type = "string"
minLength = 1
