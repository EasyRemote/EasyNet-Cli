schema_version = "3"
name = "mcp.client.call"
descriptor_version = "1.0.0"
description = "Forward a tools/call to a configured upstream MCP server. `server` is the operator-chosen name from mcp_clients.json; `name` is the upstream tool's name (as it appears in that upstream's tools/list). Returns the upstream's tools/call response verbatim (MCP {content, isError} shape)."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["server", "name"]
additionalProperties = false

[input_schema.properties.arguments]
description = "Per-tool args; shape per the upstream tool's input schema."

[input_schema.properties.name]
type = "string"
minLength = 1

[input_schema.properties.server]
type = "string"
minLength = 1
