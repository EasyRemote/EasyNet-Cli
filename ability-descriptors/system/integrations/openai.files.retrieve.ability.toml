schema_version = "3"
name = "openai.files.retrieve"
descriptor_version = "1.0.0"
description = "OpenAI-compatible file retrieval served by the device daemon. Resolves a Compatibility-profile file id through the user-rooted files surface and returns file metadata plus base64 content for the HTTP compatibility boundary."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["file_id"]

[input_schema.properties.auth_token]
type = "string"
description = "Bearer token bound to a `<user>.api_key` entry on this host."

[input_schema.properties.created_at]
type = "integer"
description = "Optional creation timestamp to preserve in the projected file object."

[input_schema.properties.file_id]
type = "string"
description = "File id returned by openai.files.upload."

[input_schema.properties.filename]
type = "string"
description = "Optional file name override for projected metadata."

[input_schema.properties.purpose]
type = "string"
description = "Optional OpenAI file purpose for projected metadata."
