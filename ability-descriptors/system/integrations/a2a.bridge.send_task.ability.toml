schema_version = "3"
name = "a2a.bridge.send_task"
descriptor_version = "1.0.0"
description = "Dispatch an A2A task against a locally-hosted agent. Resolves to the in-process registry name `<agent_name>.<skill_name>`; visibility is re-checked against the live capability publication on each call. Returns {ok:true, result} or {ok:false, error}."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["agent_name", "skill_name"]
additionalProperties = false

[input_schema.properties.agent_name]
type = "string"
minLength = 1

[input_schema.properties.args]
description = "Free-form per-skill args; shape per the skill's own input schema."

[input_schema.properties.skill_name]
type = "string"
minLength = 1
