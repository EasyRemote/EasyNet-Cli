schema_version = "3"
name = "plugin.activate_realtime"
descriptor_version = "1.0.0"
description = "Check the concrete daemon abilities, local resources, permissions, and publication state required to activate a plugin-declared realtime capability."
exposure = "operator"
dedicated_surface = "none"
subject_contract_kind = "route-target"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["package_id"]
additionalProperties = false

[input_schema.properties.package_id]
type = "string"
description = "Plugin package id to activate, for example easynet.remote_desktop."
minLength = 1

[input_schema.properties.package_version]
type = "string"
description = "Optional package version. When omitted, every installed version with the requested id is checked."
minLength = 1
