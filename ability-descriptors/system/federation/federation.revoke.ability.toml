schema_version = "2"
name = "federation.revoke"
descriptor_version = "1.0.0"
description = "Revoke a device or hosted Agent from federation presence and directory projections."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":true,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["agent_ura"]
additionalProperties = false

[input_schema.properties.agent_ura]
type = "string"
description = "Agent or Device URA to revoke."

[input_schema.properties.generation]
type = "integer"
description = "Expected generation for idempotent revocation."

[input_schema.properties.reason]
type = "string"
description = "Operator-readable revocation reason."
