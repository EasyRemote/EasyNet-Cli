[input_schema.properties.agent_ura]
type = "string"
description = "Optional advertised Agent URA whose lease is renewed."

[input_schema.properties.generation]
type = "integer"
description = "Observed advertisement generation."

[input_schema.properties.node_id]
type = "string"
description = "Heartbeat node id or device id."

[input_schema.properties.owner_ura]
type = "string"
description = "Optional owner projection whose ability lease is renewed."
