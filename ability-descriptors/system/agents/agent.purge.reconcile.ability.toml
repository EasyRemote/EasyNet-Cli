schema_version = "3"
name = "agent.purge.reconcile"
descriptor_version = "1.0.0"
description = "Authorize and audit an idempotent retry of one dead-lettered Agent purge publication transaction. The operation retains the identity fence and terminal failure evidence."
exposure = "operator"
dedicated_surface = "none"
subject_contract_kind = "explicit-ura"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["transaction_id", "command_id"]
additionalProperties = false

[input_schema.properties.action]
type = "string"
enum = ["retry"]

[input_schema.properties.command_id]
type = "string"
pattern = "^[0-9a-f]{32}$"

[input_schema.properties.transaction_id]
type = "string"
pattern = "^[0-9a-f]{32}$"
