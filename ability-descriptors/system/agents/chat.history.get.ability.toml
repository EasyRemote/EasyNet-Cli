schema_version = "3"
name = "chat.history.get"
descriptor_version = "1.0.0"
description = "Read one chat session's transcript turns (the session_meta line plus every recorded turn: prompt, reply, tool_calls, usage), verbatim."
exposure = "internal"
dedicated_surface = "none"
subject_contract_kind = "route-target"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":true,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["agent", "session_id"]
additionalProperties = false

[input_schema.properties.agent]
type = "string"
description = "Agent that owns the session — local name or canonical Agent URA."

[input_schema.properties.session_id]
type = "string"
description = "Session id to read (from chat.history.list)."
