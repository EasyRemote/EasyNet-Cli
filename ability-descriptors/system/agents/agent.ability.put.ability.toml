schema_version = "2"
name = "agent.ability.put"
descriptor_version = "1.0.0"
description = "Atomically persist executable hosted-Agent ability manifests and commit their live runtime publication."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{\"additionalProperties\":true,\"properties\":{\"agent_name\":{\"type\":\"string\"},\"ok\":{\"type\":\"boolean\"},\"owner_ura\":{\"type\":\"string\"},\"publication\":{\"type\":\"array\"},\"root_path\":{\"type\":\"string\"},\"skipped\":{\"items\":{\"type\":\"string\"},\"type\":\"array\"},\"state\":{\"type\":\"string\"},\"written\":{\"items\":{\"type\":\"string\"},\"type\":\"array\"}},\"required\":[\"ok\",\"state\",\"agent_name\",\"owner_ura\",\"written\",\"skipped\",\"publication\"],\"type\":\"object\"}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["name", "manifests_toml"]
additionalProperties = false

[input_schema.properties.conflict_policy]
type = "string"
enum = ["reject", "retain_same_binding"]

[input_schema.properties.manifests_toml]
type = "array"
items = { minLength = 1, type = "string" }
minItems = 1

[input_schema.properties.name]
type = "string"
minLength = 1

[input_schema.properties.overwrite]
type = "boolean"
