schema_version = "3"
name = "agent.start"
descriptor_version = "1.0.0"
description = "Register a new LLM sub-agent (claude/codex/…) in the device's agent registry. This is the daemon-hosted surface behind `easynet agent add`; callers may send primitive fields or a rich entry object. Returns agent_ura and replaced_prior=true means the call overwrote an existing row."
exposure = "operator"
dedicated_surface = "none"
subject_contract_kind = "explicit-ura"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["name"]
additionalProperties = false
anyOf = [{ required = ["agent_type"] }, { required = ["entry"] }]

[input_schema.properties.agent_type]
type = "string"
enum = ["claude-code", "claude", "codex", "codex-app-server", "codex-appserver"]

[input_schema.properties.entry]
type = "object"
required = ["agent_type"]
additionalProperties = false

[input_schema.properties.entry.properties.agent_type]
type = "string"
enum = ["claude-code", "claude", "codex", "codex-app-server", "codex-appserver"]

[input_schema.properties.entry.properties.args]
type = "array"
items = { type = "string" }

[input_schema.properties.entry.properties.command]
type = "string"

[input_schema.properties.entry.properties.env]
type = "object"
additionalProperties = { type = "string" }

[input_schema.properties.entry.properties.label]
type = ["string", "null"]

[input_schema.properties.entry.properties.max_output_bytes]
type = "integer"
minimum = 0

[input_schema.properties.entry.properties.model]
type = ["string", "null"]

[input_schema.properties.entry.properties.root_path]
type = ["string", "null"]

[input_schema.properties.entry.properties.schema_version]
type = "integer"
minimum = 0

[input_schema.properties.entry.properties.timeout_secs]
type = "integer"
minimum = 0

[input_schema.properties.label]
type = "string"

[input_schema.properties.materialize_directory]
type = "boolean"

[input_schema.properties.model]
type = ["string", "null"]

[input_schema.properties.model_present]
type = "boolean"

[input_schema.properties.name]
type = "string"
minLength = 1

[input_schema.properties.project_workspace]
type = "boolean"

[input_schema.properties.root_path]
type = "string"

[input_schema.properties.update_existing_spec]
type = "boolean"
