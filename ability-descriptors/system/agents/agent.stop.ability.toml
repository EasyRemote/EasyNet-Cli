schema_version = "2"
name = "agent.stop"
descriptor_version = "1.0.0"
description = "Remove an LLM sub-agent registry row by name or Agent URA. Idempotent: ack=false when the row didn't exist. The registered root directory is always preserved."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false
anyOf = [{ required = ["name"] }, { required = ["agent_ura"] }]

[input_schema.properties.agent_ura]
type = "string"
minLength = 1

[input_schema.properties.name]
type = "string"
minLength = 1
