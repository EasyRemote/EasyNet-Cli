schema_version = "1"
name = "ability.uninstall"
description = "Uninstall an ability from a node. Mirrors `ability.deploy`: local target removes the durable row, runtime binding, and control-plane record; remote targets are queued for the federation Invoke replacement."

[input_schema]
type = "object"
required = ["ability_ura"]
additionalProperties = false

[input_schema.properties.ability_ura]
type = "string"

[input_schema.properties.install_id]
type = "string"

[input_schema.properties.node_id]
type = "string"
