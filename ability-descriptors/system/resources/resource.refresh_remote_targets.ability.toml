schema_version = "3"
name = "resource.refresh_remote_targets"
descriptor_version = "1.0.0"
description = "Refresh the daemon-local live inventory of display, application, and window resources. The handler owns the host-local discovery pass, atomically updates the resource cache, and returns a live projection with freshness metadata for target pickers. `meta.list_resources` remains a read-only cache projection."
exposure = "internal"
dedicated_surface = "none"
subject_contract_kind = "route-target"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.types]
type = "array"
items = { enum = ["display", "application", "window"], type = "string" }
description = "Optional filter for refreshed remote targets. Absent or empty returns display, application, and window rows."
