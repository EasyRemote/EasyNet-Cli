schema_version = "2"
name = "voice.subscribe"
descriptor_version = "1.0.0"
description = "Subscribe to a realm Hub voice-synthesis resource. Returns a server-pushed stream of TTS audio BinaryChunk frames. Subject MUST be a voice resource_ura (one Hub may expose multiple voice profiles)."
call_mode = "stream"
capability_state = "unsupported"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "null"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.format]
type = "string"
enum = ["opus"]

[input_schema.properties.sample_rate]
type = "integer"
enum = [24000, 48000]
