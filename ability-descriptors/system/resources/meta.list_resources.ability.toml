schema_version = "3"
name = "meta.list_resources"
descriptor_version = "1.0.0"
description = "List physical and logical resources held by this Agent (mics, cameras, displays, applications, windows, speakers, voice profiles, ASR models). Each entry's `resource_ura` is the canonical subject for media abilities (mic.subscribe, camera.snapshot, ...). Optional `types` filter narrows the result."
exposure = "operator"
dedicated_surface = "none"
subject_contract_kind = "route-target"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":true,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.types]
type = "array"
items = { enum = ["mic", "camera", "display", "application", "window", "speaker", "voice", "asr_model"], type = "string" }
description = "Filter to these resource types. Absent or empty = all."
