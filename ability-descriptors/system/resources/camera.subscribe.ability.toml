schema_version = "3"
name = "camera.subscribe"
descriptor_version = "2.0.0"
description = "Subscribe to a camera resource. Emits bounded latest-frame image/jpeg payload bytes at the requested fps and resolution; sequence and terminal lifecycle remain Runtime metadata. Subject MUST be a camera resource_ura."
exposure = "task"
dedicated_surface = "media"
subject_contract_kind = "dedicated-surface"
call_mode = "stream"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":true,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.codec]
type = "string"
enum = ["jpeg"]

[input_schema.properties.fps]
type = "integer"
minimum = 1
maximum = 60

[input_schema.properties.resolution]
type = "string"
