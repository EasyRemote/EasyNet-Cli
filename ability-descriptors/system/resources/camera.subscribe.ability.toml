schema_version = "2"
name = "camera.subscribe"
descriptor_version = "1.0.0"
description = "Subscribe to a camera resource. Returns a server-pushed stream of video BinaryChunk frames at the requested fps / resolution / codec. Subject MUST be a camera resource_ura."
call_mode = "stream"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":true,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.codec]
type = "string"
enum = ["h264", "raw", "vp9"]

[input_schema.properties.fps]
type = "integer"
minimum = 1
maximum = 60

[input_schema.properties.resolution]
type = "string"
