schema_version = "3"
name = "skill.list"
descriptor_version = "1.0.0"
description = "List skills installed for an agent (or all agents). Canonical skill inventory surface; returns InstalledSkill rows."
exposure = "operator"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":true,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.agent_ura]
type = "string"
description = "Canonical owner Agent URA. Filters to that hosted agent and derives authoritative skill resource_ura values."

[input_schema.properties.owner_agent_id]
type = "string"
description = "Optional. Filter to skills owned by this agent. Absent = all agents."

[input_schema.properties.subject_ura]
type = "string"
description = "Owner Agent URA or skill package Resource URA. A skill Resource URA filters to that single skill."
