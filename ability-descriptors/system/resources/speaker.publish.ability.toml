schema_version = "3"
name = "speaker.publish"
descriptor_version = "1.0.0"
description = "Push audio frames to a speaker resource. Caller streams BinaryChunk frames UP; downstream channel exists per axon bidi shape but emits no frames. Subject MUST be a speaker resource_ura."
exposure = "task"
dedicated_surface = "media"
subject_contract_kind = "dedicated-surface"
call_mode = "bidi"
capability_state = "unsupported"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":true}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.channels]
type = "integer"
enum = [1, 2]

[input_schema.properties.codec]
type = "string"
enum = ["opus"]

[input_schema.properties.sample_rate]
type = "integer"
enum = [24000, 48000]
