schema_version = "3"
name = "screen.snapshot"
descriptor_version = "1.0.0"
description = "Capture one still image of a screen target. Subject MUST be a screen resource_ura whose type is `display`, `application`, or `window`. Optional `region` arg is valid ONLY when subject's type is `display`."
exposure = "task"
dedicated_surface = "media"
subject_contract_kind = "dedicated-surface"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.format]
type = "string"
enum = ["jpeg", "png"]

[input_schema.properties.region]
type = "object"
additionalProperties = false

[input_schema.properties.region.properties.h]
type = "integer"
minimum = 1

[input_schema.properties.region.properties.w]
type = "integer"
minimum = 1

[input_schema.properties.region.properties.x]
type = "integer"
minimum = 0

[input_schema.properties.region.properties.y]
type = "integer"
minimum = 0
