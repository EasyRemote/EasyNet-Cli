schema_version = "2"
name = "voice.report_metrics"
descriptor_version = "1.0.0"
description = "Report QoS metrics from a participant (jitter, packet loss, bitrate). The metrics value is appended to the call's event log and stored as the participant's `last_metrics` snapshot."
call_mode = "rpc"
capability_state = "seam"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{\"additionalProperties\":false,\"properties\":{\"ack\":{\"type\":\"boolean\"},\"call_id\":{\"type\":\"string\"},\"participant_id\":{\"type\":\"string\"}},\"required\":[\"call_id\",\"participant_id\",\"ack\"],\"type\":\"object\"}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["call_id", "participant_id"]
additionalProperties = false

[input_schema.properties.call_id]
type = "string"

[input_schema.properties.metrics]
type = "object"
additionalProperties = false

[input_schema.properties.metrics.properties.audio_level_dbov]
type = "number"

[input_schema.properties.metrics.properties.concealed_samples]
type = "integer"
minimum = 0

[input_schema.properties.metrics.properties.jitter_ms]
type = "number"

[input_schema.properties.metrics.properties.packet_loss_ratio]
type = "number"
minimum = 0.0
maximum = 1.0

[input_schema.properties.metrics.properties.rtt_ms]
type = "number"

[input_schema.properties.participant_id]
type = "string"
