schema_version = "2"
name = "skill.remove"
descriptor_version = "1.0.0"
description = "Remove an installed skill from an agent. Errors when the skill isn't present so callers can decide whether to treat that as success."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["name", "agent"]
additionalProperties = false

[input_schema.properties.agent]
type = "string"
description = "Agent that owns the skill"

[input_schema.properties.agent_ura]
type = "string"
description = "Canonical agent URA for audit context."

[input_schema.properties.name]
type = "string"
description = "Skill name as installed under <agent-root>/skills/<name>/"
