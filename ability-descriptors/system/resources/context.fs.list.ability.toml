schema_version = "3"
name = "context.fs.list"
descriptor_version = "1.0.0"
description = "Browse one directory level inside a mapped project folder."
exposure = "task"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":true,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["folder"]
additionalProperties = false

[input_schema.properties.folder]
type = "string"
description = "Mapped folder name (or its path)."

[input_schema.properties.path]
type = "string"
description = "Relative path inside the folder; empty = root."
