schema_version = "3"
name = "mic.subscribe"
descriptor_version = "1.0.0"
description = "Subscribe to a microphone resource. Returns a server-pushed stream of audio BinaryChunk frames in the requested codec. Subject MUST be a mic resource_ura (use meta.list_resources to discover)."
exposure = "task"
dedicated_surface = "media"
subject_contract_kind = "dedicated-surface"
call_mode = "stream"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":true,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.channels]
type = "integer"
enum = [1, 2]

[input_schema.properties.codec]
type = "string"
enum = ["opus"]

[input_schema.properties.sample_rate]
type = "integer"
enum = [16000, 24000, 48000]
