schema_version = "2"
name = "skill.unpublish"
descriptor_version = "1.0.0"
description = "Remove a skill from an agent's skills/ directory. Hard delete of the skill subtree; daemon log records the deleted skill's content hash for recovery from backup."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["owner_agent_id", "skill_name"]

[input_schema.properties.owner_agent_id]
type = "string"

[input_schema.properties.skill_name]
type = "string"
