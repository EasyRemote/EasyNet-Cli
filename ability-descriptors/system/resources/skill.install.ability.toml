schema_version = "3"
name = "skill.install"
descriptor_version = "1.0.0"
description = "Install a skill from a marketplace source into an agent's skills/ directory. v1 supports github: sources. Returns the InstallRecord (name, agent_id, source, skill_tree_hash, size_bytes, installed_at)."
exposure = "operator"
dedicated_surface = "none"
subject_contract_kind = "authenticated-user"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["source", "agent"]
additionalProperties = false

[input_schema.properties.agent]
type = "string"
description = "Agent name that will own this skill"

[input_schema.properties.agent_ura]
type = "string"
description = "Canonical agent URA for the owning agent; used to derive returned resource_ura."

[input_schema.properties.pin]
type = "string"
description = "Override the ref in the source URL with a concrete tag/SHA"

[input_schema.properties.source]
type = "string"
description = "Skill source URL: github:<owner>/<repo>[@<ref>][:<subpath>]"
