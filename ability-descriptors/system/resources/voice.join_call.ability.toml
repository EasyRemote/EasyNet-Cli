schema_version = "2"
name = "voice.join_call"
descriptor_version = "1.0.0"
description = "Add a participant to an existing call. The call transitions from `VOICE_CALL_STATE_RINGING` to `VOICE_CALL_STATE_ACTIVE` only when at least two participants are present; an optional creator supplied to `voice.create_call` counts as one participant. Response `state` carries the product contract name and `state_code` carries the numeric wire value. Optional `sdp_offer` carries the participant's SDP; ICE candidates stream in via subsequent `voice.report_metrics`-style updates."
call_mode = "rpc"
capability_state = "seam"
admission_action = "invoke"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{\"additionalProperties\":false,\"properties\":{\"call_id\":{\"type\":\"string\"},\"participant_id\":{\"type\":\"string\"},\"state\":{\"type\":\"string\"},\"state_code\":{\"type\":\"integer\"}},\"required\":[\"call_id\",\"participant_id\",\"state\",\"state_code\"],\"type\":\"object\"}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["call_id", "participant_id"]
additionalProperties = false

[input_schema.properties.call_id]
type = "string"

[input_schema.properties.participant_id]
type = "string"

[input_schema.properties.sdp_offer]
type = "string"
