schema_version = "1"
name = "voice.join_call"
description = "Add a participant to an existing call. The first participant transitions the call from `VOICE_CALL_STATE_RINGING` to `VOICE_CALL_STATE_ACTIVE`. Response `state` carries the Axon contract enum name and `state_code` carries the numeric wire value. Optional `sdp_offer` carries the participant's SDP; ICE candidates stream in via subsequent `voice.report_metrics`-style updates."

[input_schema]
type = "object"
required = ["call_id", "participant_id"]
additionalProperties = false

[input_schema.properties.call_id]
type = "string"

[input_schema.properties.participant_id]
type = "string"

[input_schema.properties.sdp_offer]
type = "string"
