schema_version = "2"
name = "screen.subscribe"
descriptor_version = "1.0.0"
description = "Subscribe to a screen target. Subject MUST be a screen resource_ura whose type is `display`, `application`, or `window` (use meta.list_resources to discover). Optional `region` arg is valid ONLY when subject's type is `display` (window/application bounds are self-defining)."
call_mode = "stream"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":true,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.codec]
type = "string"
enum = ["h264", "raw", "vp9"]

[input_schema.properties.fps]
type = "integer"
minimum = 1
maximum = 60

[input_schema.properties.region]
type = "object"
additionalProperties = false

[input_schema.properties.region.properties.h]
type = "integer"
minimum = 1

[input_schema.properties.region.properties.w]
type = "integer"
minimum = 1

[input_schema.properties.region.properties.x]
type = "integer"
minimum = 0

[input_schema.properties.region.properties.y]
type = "integer"
minimum = 0

[input_schema.properties.resolution]
type = "string"
