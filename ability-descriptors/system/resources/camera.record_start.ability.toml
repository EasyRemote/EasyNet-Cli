schema_version = "3"
name = "camera.record_start"
descriptor_version = "2.0.0"
description = "Start a bounded recording session for a camera resource. Subject MUST be a camera resource_ura. Returns a recording_session_id that must be passed to camera.record_stop."
exposure = "task"
dedicated_surface = "media"
subject_contract_kind = "dedicated-surface"
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "stream"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "state_transition"
transition_id = "camera.record_start@v2"
transition_class = "operational"

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.codec]
type = "string"
enum = ["h264", "mjpeg"]

[input_schema.properties.fps]
type = "integer"
minimum = 1
maximum = 60

[input_schema.properties.max_bytes]
type = "integer"
minimum = 1048576
maximum = 268435456

[input_schema.properties.max_duration_ms]
type = "integer"
minimum = 1000
maximum = 1800000

[input_schema.properties.resolution]
type = "string"
