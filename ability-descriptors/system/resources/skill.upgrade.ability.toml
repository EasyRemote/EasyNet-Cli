schema_version = "2"
name = "skill.upgrade"
descriptor_version = "1.0.0"
description = "Upgrade an installed skill to a target ref (or upstream HEAD). The current skill dir is backed up before the new version is fetched and installed; if anything fails the backup is restored."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["name", "agent"]
additionalProperties = false

[input_schema.properties.agent]
type = "string"
description = "Agent that owns the skill"

[input_schema.properties.agent_ura]
type = "string"
description = "Canonical agent URA for the owning agent; used to derive returned resource_ura."

[input_schema.properties.name]
type = "string"
description = "Skill name to upgrade"

[input_schema.properties.to]
type = "string"
description = "Target ref (tag/SHA/branch). Omit for upstream HEAD."
