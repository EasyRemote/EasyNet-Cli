schema_version = "2"
name = "skill.read_file"
descriptor_version = "1.0.0"
description = "Read one UTF-8 file from an installed skill package. The path is relative to the skill directory and traversal outside that directory is rejected."
call_mode = "rpc"
capability_state = "cutover_ready"
admission_action = "read"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":true,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["owner_agent_id", "skill_name", "resource_ura", "path"]
additionalProperties = false

[input_schema.properties.owner_agent_id]
type = "string"

[input_schema.properties.path]
type = "string"
description = "Relative file path inside the skill directory, for example SKILL.md."

[input_schema.properties.resource_ura]
type = "string"
description = "Canonical skill package resource URA returned by skill.list."

[input_schema.properties.skill_name]
type = "string"
