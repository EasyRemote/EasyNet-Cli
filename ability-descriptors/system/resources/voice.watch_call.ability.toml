scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{\"additionalProperties\":false,\"properties\":{\"call_id\":{\"type\":\"string\"},\"events\":{\"items\":{\"type\":\"object\"},\"type\":\"array\"},\"view\":{\"enum\":[\"snapshot\"],\"type\":\"string\"}},\"required\":[\"call_id\",\"events\",\"view\"],\"type\":\"object\"}"
hints_json = "{\"read_only\":true,\"destructive\":false,\"idempotent\":true,\"streaming_only\":false,\"bidi_only\":false}"
