# EasyNet Hub-Pages — nginx in Docker, ability layer on host daemon
# =================================================================
#
# v0.6 ontology: 01HUB.pages.serve is an ability — substrate (the
# process that runs the ability code) can be anywhere. This config
# makes the substrate a Docker container running nginx; the
# container forwards every HTTP request to the host's daemon,
# which runs the actual Pages reference system fetch + api logic.
#
# Mac-host daemon listens on :8788 (internal-only); nginx
# container publishes :8787 to the world. Browser → :8787 →
# this container → host.docker.internal:8788 → daemon. Host
# header is preserved so `parse_pages_host` in the daemon's
# listener still routes by subdomain.
#
# This is the production-shape: the daemon is the executor, the
# container is the HTTP boundary. Same code path works when the
# daemon runs in a sibling container.

worker_processes auto;
events { worker_connections 1024; }

http {
    upstream easynet_daemon {
        # `host.docker.internal` — Docker Desktop's magic alias for
        # the host machine's loopback interface. On Linux production
        # this becomes the actual daemon container IP.
        # Daemon listens on :8788 (internal); nginx publishes
        # :8787 to the world. silan's browser hits :8787 →
        # enters this container → forwards to :8788 on the host.
        server host.docker.internal:8788;
    }

    server {
        listen 8787;
        server_name *.*.pages.localhost;

        # Pass Host header through verbatim so the daemon's
        # parse_pages_host('<project>.<user>.pages.localhost:8787')
        # still resolves project + user from the subdomain.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;

        # Generous timeout for /api/* slow paths.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # CORS preflight passthrough — daemon already handles it.
        location / {
            proxy_pass http://easynet_daemon;
        }
    }
}
