# EasyNet Hub-Pages — docker-compose for the in-Docker Hub
# ========================================================
#
# silan's directive: "hub 你还是在 docker 启动就行".
#
# Architecture (v0 transitional, magnetic-disk-friendly):
#
#   Browser → docker container (nginx:alpine, this compose) → host daemon
#                                                              │
#                                                              ▼
#                                                              Pages reference
#                                                              system runs here:
#                                                              - openat2 sandbox
#                                                              - PUBLISHED_PROJECTS
#                                                              - api manifest eval
#
# The container's only job is the HTTP boundary; the substrate
# that runs the ability code is the host daemon. RFC-006-B v0.6
# INV-1 (Adapter Purity) holds: nginx mutates nothing, just
# forwards. The hub-as-agent invariant holds: 01HUB.pages.serve
# remains the ability, just with its substrate split between two
# processes.
#
# Future evolution (post-disk-pressure): replace nginx with a
# Rust container running easynet-daemon directly (already prepared
# in /tmp/Dockerfile.hub-aarch64); same compose file gets a
# build: directive added; same port mapping; ontology unchanged.

services:
  hub-pages:
    image: nginx:alpine
    container_name: easynet-hub-pages
    ports:
      - "8787:8787"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # Docker Desktop on macOS provides this alias automatically;
      # adding it explicitly makes the config portable to Docker on
      # Linux where the alias is not pre-baked.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
