# EasyNet Hub-in-Docker — full-daemon container
#
# Build context = /Users/macbook.silan.tech/Documents/GitHub
# (parent of EasyNet-Cli and EasyNet-Axon, so the path-dep
# resolves at build time).
#
# Volumes:
#   - ./sites:/sites:ro      Mac-side project tree, mounted read-only.
#                            Each subdir becomes a published project.
#                            Edit files on Mac → daemon reads on next
#                            request (openat2 via folder fd is live).
#
# silan's browser hits localhost:8787 → goes straight into this
# container's daemon, which runs the canonical Pages reference
# system (page.fetch, api.<verb>, sandbox).

services:
  hub:
    build:
      # Context = EasyNet-Cli root. Axon SDK is vendored under
      # packaging/docker/hub-pages/full/vendor/easynet-axon-sdk-rust/ so the
      # build does not need to reach EasyNet-Cli's parent dir.
      # The Dockerfile rewrites Cargo.toml path-dep to point at
      # the vendored copy.
      context: ../../../..
      dockerfile: packaging/docker/hub-pages/full/Dockerfile
    image: easynet-hub:dev
    container_name: easynet-hub-pages
    ports:
      - "8787:8787"
    environment:
      EASYNET_PAGES_PORT: "8787"
      EASYNET_PAGES_USER: "alice"
      EASYNET_PAGES_REALM: "easynet.run"
      # Bind 0.0.0.0 inside the container so Docker's port mapping
      # actually reaches the listener (loopback-only would only
      # accept inside-the-container connections).
      EASYNET_PAGES_BIND: "0.0.0.0"
    volumes:
      - ./sites:/sites:ro
    restart: unless-stopped
