<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RemoteApp Live Media Target</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07111f;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="motion-target" aria-label="RemoteApp deterministic motion target"></canvas>
    <script>
      const canvas = document.querySelector('#motion-target')
      const context = canvas.getContext('2d', { alpha: false })

      function render(timestamp) {
        const ratio = window.devicePixelRatio || 1
        const width = Math.max(1, Math.floor(window.innerWidth * ratio))
        const height = Math.max(1, Math.floor(window.innerHeight * ratio))
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width
          canvas.height = height
        }

        const phase = timestamp / 1000
        const gradient = context.createLinearGradient(0, 0, width, height)
        gradient.addColorStop(0, `hsl(${(phase * 47) % 360} 84% 42%)`)
        gradient.addColorStop(0.5, `hsl(${(phase * 71 + 100) % 360} 78% 24%)`)
        gradient.addColorStop(1, `hsl(${(phase * 31 + 220) % 360} 82% 38%)`)
        context.fillStyle = gradient
        context.fillRect(0, 0, width, height)

        const radius = Math.max(24, Math.min(width, height) * 0.08)
        const x = width * (0.5 + 0.38 * Math.sin(phase * 1.7))
        const y = height * (0.5 + 0.32 * Math.cos(phase * 1.3))
        context.beginPath()
        context.arc(x, y, radius, 0, Math.PI * 2)
        context.fillStyle = '#f8fafc'
        context.fill()

        context.fillStyle = '#f8fafc'
        context.font = `${Math.max(24, Math.floor(height * 0.055))}px ui-monospace, monospace`
        context.fillText(`frame ${Math.floor(timestamp / (1000 / 60))}`, width * 0.06, height * 0.12)
        requestAnimationFrame(render)
      }

      requestAnimationFrame(render)
    </script>
  </body>
</html>
