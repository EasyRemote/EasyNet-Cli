schema_version = "1"
name = "device.remote_desktop.watch_events"
description = "Watch remote desktop control events. v1 returns the bounded current snapshot through InvokeStream; live fan-out follows the Axon contract."

[input_schema]
type = "object"
required = ["session_id", "session_token"]
additionalProperties = false

[input_schema.properties.from_sequence]
type = "integer"
minimum = 0

[input_schema.properties.session_id]
type = "string"

[input_schema.properties.session_token]
type = "string"
