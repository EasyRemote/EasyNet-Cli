schema_version = "1"
name = "device.remote_desktop.add_ice_candidate"
description = "Append one ICE candidate to a remote desktop session's signaling log."

[input_schema]
type = "object"
required = ["session_id", "session_token", "candidate"]
additionalProperties = false

[input_schema.properties.candidate]
type = "object"

[input_schema.properties.session_id]
type = "string"

[input_schema.properties.session_token]
type = "string"
