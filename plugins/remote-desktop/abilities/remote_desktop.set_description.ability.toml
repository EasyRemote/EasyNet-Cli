schema_version = "2"
name = "remote_desktop.set_description"
descriptor_version = "1.0.0"
description = "Attach a WebRTC-style local or remote session description to a remote desktop session. A remote SDP offer starts the device-side direct WebRTC media endpoint and returns the SDP answer in local_description; media is not routed through unary Invoke."
call_mode = "rpc"
capability_state = "provider_backed"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "any"
scope_subjects_uras = []
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["session_id", "session_token", "side", "description"]
additionalProperties = false

[input_schema.properties.description]
type = "object"

[input_schema.properties.session_id]
type = "string"

[input_schema.properties.session_token]
type = "string"

[input_schema.properties.side]
type = "string"
enum = ["local", "remote"]
