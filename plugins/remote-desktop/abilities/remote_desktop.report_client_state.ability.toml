schema_version = "3"
name = "remote_desktop.report_client_state"
descriptor_version = "1.0.0"
description = "Report browser-observed media presentation and bounded transport evidence for the active remote desktop transport epoch."
exposure = "operator"
dedicated_surface = "remote_desktop"
subject_contract_kind = "dedicated-surface"
call_mode = "rpc"
capability_state = "provider_backed"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "only_ura_kinds"
scope_subjects_uras = ["resource"]
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["session_id", "session_token", "transport_epoch", "state"]
additionalProperties = false

[input_schema.properties.session_id]
type = "string"

[input_schema.properties.session_token]
type = "string"

[input_schema.properties.state]
type = "string"
enum = ["presenting", "stalled", "detached"]

[input_schema.properties.transport_epoch]
type = "integer"
minimum = 1

[input_schema.properties.client_transport]
type = "object"
additionalProperties = false

[input_schema.properties.client_transport.properties.ice_connection_state]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.peer_connection_state]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.route_kind]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.sampled_at_ms]
type = "number"

[input_schema.properties.client_transport.properties.selected_candidate_pair]
type = "object"
additionalProperties = false

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.id]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.candidate_pair_id]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.local_candidate_id]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.remote_candidate_id]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.local_candidate_type]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.remote_candidate_type]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.selected_route_class]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.protocol]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.state]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.selected]
type = "boolean"

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.nominated]
type = "boolean"

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.current_round_trip_time_ms]
type = "number"

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.available_outgoing_bitrate_bps]
type = "number"

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.available_incoming_bitrate_bps]
type = "number"

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.packets_discarded_on_send]
type = "number"

[input_schema.properties.client_transport.properties.selected_candidate_pair.properties.bytes_discarded_on_send]
type = "number"

[input_schema.properties.browser_stats]
type = "object"
additionalProperties = false

[input_schema.properties.browser_stats.properties.sampled_at_ms]
type = "number"

[input_schema.properties.browser_stats.properties.frames_decoded]
type = "number"

[input_schema.properties.browser_stats.properties.frames_dropped]
type = "number"

[input_schema.properties.browser_stats.properties.frames_received]
type = "number"

[input_schema.properties.browser_stats.properties.frame_width]
type = "number"

[input_schema.properties.browser_stats.properties.frame_height]
