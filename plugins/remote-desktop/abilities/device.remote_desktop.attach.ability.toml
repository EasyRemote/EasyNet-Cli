schema_version = "1"
name = "device.remote_desktop.attach"
description = "Attach a bounded Axon InvokeBidi media plane to an existing remote desktop session. Subject MUST match the resource_ura bound when the session was created. Control metadata remains reliable JSON, while live H.264/JPEG media chunks are bounded and may drop stale frames to preserve low latency; WebRTC remains the preferred direct transport when negotiation succeeds."

[input_schema]
type = "object"
required = ["session_id", "session_token"]
additionalProperties = false

[input_schema.properties.encoding]
type = "string"
enum = ["annexb_h264", "jpeg_binary", "jpeg", "image/jpeg"]

[input_schema.properties.fps]
type = "integer"
minimum = 1
maximum = 144

[input_schema.properties.resolution]
type = "string"

[input_schema.properties.session_id]
type = "string"

[input_schema.properties.session_token]
type = "string"

[input_schema.properties.video]
type = "object"
