schema_version = "2"
name = "remote_desktop.refresh_lease"
descriptor_version = "1.0.0"
description = "Refresh a non-terminal remote desktop session lease."
call_mode = "rpc"
capability_state = "provider_backed"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "only_ura_kinds"
scope_subjects_uras = ["resource"]
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["session_id", "session_token"]
additionalProperties = false

[input_schema.properties.lease_ttl_ms]
type = "integer"
minimum = 1
maximum = 300000

[input_schema.properties.requested_ttl_seconds]
type = "integer"
minimum = 1
maximum = 300

[input_schema.properties.session_id]
type = "string"

[input_schema.properties.session_token]
type = "string"
