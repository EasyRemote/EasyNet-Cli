schema_version = "3"
name = "remote_desktop.add_ice_candidate"
descriptor_version = "1.0.0"
description = "Append one ICE candidate to the active epoch of a remote desktop session's signaling log."
exposure = "operator"
dedicated_surface = "remote_desktop"
subject_contract_kind = "dedicated-surface"
call_mode = "rpc"
capability_state = "provider_backed"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "only_ura_kinds"
scope_subjects_uras = ["resource"]
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["session_id", "session_token", "transport_epoch", "candidate"]
additionalProperties = false

[input_schema.properties.candidate]
type = "object"

[input_schema.properties.session_id]
type = "string"

[input_schema.properties.session_token]
type = "string"

[input_schema.properties.transport_epoch]
type = "integer"
minimum = 1
