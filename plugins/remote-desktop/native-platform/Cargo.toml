[package]
name = "easynet-remoteapp-native-platform"
version = "0.149.10"
edition = "2021"
publish = false
description = "Private native identity and capture-eligibility port shared by EasyNet RemoteApp processes."

[dependencies]
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
xcb = { version = "1.7", features = ["res"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
