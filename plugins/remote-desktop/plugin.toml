schema_version = "1"
id = "easynet.remote_desktop"
version = "0.1.0"
kind = "builtin"
entrypoint = "easynet_plugin_remote_desktop::provider"

abilities = ["abilities/*.ability.toml"]
permissions = [
  "screen_capture",
  "input_injection",
  "local_user_consent",
]
resources = [
  "display",
  "window",
  "application",
]
platforms = ["macos", "linux"]

[limits]
max_sessions = 128
max_frame_queue = 1

[[realtime_capability]]
kind = "screen"
modes = ["subscribe", "record"]
transport = "webrtc"
activation_abilities = [
  "remote_desktop.grant_consent",
  "remote_desktop.create_session",
  "remote_desktop.set_description",
  "remote_desktop.add_ice_candidate",
  "remote_desktop.attach",
  "remote_desktop.end_session",
  "remote_desktop.permission_status",
  "remote_desktop.request_permission",
]
permissions = [
  "screen_capture",
  "input_injection",
  "local_user_consent",
]
resources = [
  "display",
  "window",
  "application",
]
quick_add = true

[[ability_metadata]]
name = "remote_desktop.grant_consent"
layer = "control"
call_mode = "rpc"

[[ability_metadata]]
name = "remote_desktop.create_session"
layer = "control"
call_mode = "rpc"

[[ability_metadata]]
name = "remote_desktop.show_session"
layer = "observation"
call_mode = "rpc"

[[ability_metadata]]
name = "remote_desktop.set_description"
layer = "control"
call_mode = "rpc"

[[ability_metadata]]
name = "remote_desktop.add_ice_candidate"
layer = "control"
call_mode = "rpc"

[[ability_metadata]]
name = "remote_desktop.watch_events"
layer = "observation"
call_mode = "stream"

[[ability_metadata]]
name = "remote_desktop.refresh_lease"
layer = "control"
call_mode = "rpc"

[[ability_metadata]]
name = "remote_desktop.end_session"
layer = "control"
call_mode = "rpc"

[[ability_metadata]]
name = "remote_desktop.attach"
layer = "operational"
call_mode = "bidi"
bidi_wire_kind = "json_frames"

[[ability_metadata]]
name = "remote_desktop.permission_status"
layer = "observation"
call_mode = "rpc"

[[ability_metadata]]
name = "remote_desktop.request_permission"
layer = "control"
call_mode = "rpc"
