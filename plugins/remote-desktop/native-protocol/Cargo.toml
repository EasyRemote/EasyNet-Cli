[package]
name = "easynet-remoteapp-native-protocol"
version = "0.148.60"
edition = "2021"
publish = false
description = "Private bounded IPC contract shared by the EasyNet RemoteApp daemon client and native host."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
memmap2 = "0.9"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
] }

[dev-dependencies]
bytes = "1"
openh264 = "0.9"
