schema_version = "3"
name = "browser.send_input"
descriptor_version = "1.0.0"
description = "Apply one human-scale navigation, pointer, keyboard, text, or form event to the real page target through Chrome DevTools Protocol. The plugin brings the target to the foreground before input so human-visible focus and agent focus stay aligned. The invocation subject MUST be the browser session resource URA."
exposure = "operator"
dedicated_surface = "browser"
subject_contract_kind = "dedicated-surface"
call_mode = "rpc"
capability_state = "provider_backed"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "only_ura_kinds"
scope_subjects_uras = ["resource"]
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["event"]
additionalProperties = false

[input_schema.properties.event]
type = "object"
required = ["kind"]
additionalProperties = false

[input_schema.properties.event.properties.action]
type = "string"
enum = ["move", "down", "up"]

[input_schema.properties.event.properties.button]
type = "string"
enum = ["none", "left", "middle", "right"]

[input_schema.properties.event.properties.delta_x]
type = "number"

[input_schema.properties.event.properties.delta_y]
type = "number"

[input_schema.properties.event.properties.key]
type = "string"
minLength = 1
maxLength = 256

[input_schema.properties.event.properties.kind]
type = "string"
enum = ["navigate", "click", "mouse", "scroll", "keydown", "keyup", "text", "fill"]

[input_schema.properties.event.properties.selector]
type = "string"
minLength = 1
maxLength = 4096

[input_schema.properties.event.properties.text]
type = "string"
maxLength = 65536

[input_schema.properties.event.properties.url]
type = "string"
maxLength = 65536
pattern = "^https?://"

[input_schema.properties.event.properties.value]
type = "string"
maxLength = 65536

[input_schema.properties.event.properties.x]
type = "number"

[input_schema.properties.event.properties.y]
type = "number"
