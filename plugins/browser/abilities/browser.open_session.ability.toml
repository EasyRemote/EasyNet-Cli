schema_version = "3"
name = "browser.open_session"
descriptor_version = "1.0.0"
description = "Open a real Chrome/Chromium page target governed by the EasyNet browser plugin. Headed mode is the default so a human and an agent can operate the same page. The plugin launches Chrome with an isolated non-default profile or connects to an explicit loopback CDP endpoint, negotiates the running protocol version, and returns a resource URA used as the subject of subsequent browser invocations."
exposure = "operator"
dedicated_surface = "browser"
subject_contract_kind = "dedicated-surface"
call_mode = "rpc"
capability_state = "provider_backed"
admission_action = "manage"
visibility = "SCOPED"
scope_subjects_kind = "only_ura_kinds"
scope_subjects_uras = ["agent"]
scope_agents_kind = "any"
scope_agents_uras = []
denied_agents = []
output_receipt_schema_json = "{}"
hints_json = "{\"read_only\":false,\"destructive\":false,\"idempotent\":false,\"streaming_only\":false,\"bidi_only\":false}"
receipt_semantics = "operational"

[input_schema]
type = "object"
required = ["url"]
additionalProperties = false

[input_schema.properties.cdp_endpoint]
type = "string"
description = "Existing loopback CDP HTTP or browser WebSocket endpoint."
minLength = 1
maxLength = 65536

[input_schema.properties.executable_path]
type = "string"
description = "Explicit local Chrome/Chromium executable path."
minLength = 1
maxLength = 65536

[input_schema.properties.headless]
type = "boolean"
description = "Launch without a visible window. Defaults to false."

[input_schema.properties.idle_timeout_seconds]
type = "integer"
minimum = 60
maximum = 7200

[input_schema.properties.profile]
type = "string"
description = "Named persistent profile under the EasyNet browser state root."
pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"

[input_schema.properties.url]
type = "string"
description = "Initial page URL. http:// and https:// only."
minLength = 1
maxLength = 65536
pattern = "^https?://"

[input_schema.properties.viewport_height]
type = "integer"
minimum = 240
maximum = 2400

[input_schema.properties.viewport_width]
type = "integer"
minimum = 320
maximum = 3840
