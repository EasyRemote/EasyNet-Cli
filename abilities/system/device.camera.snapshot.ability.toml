schema_version = "1"
name = "device.camera.snapshot"
description = "Capture one still image from a camera resource. Subject MUST be a camera resource_uri. Returns { image_bytes_b64 OR payloadstore_uri, captured_at } in the receipt body."

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.format]
type = "string"
enum = ["jpeg", "png"]
