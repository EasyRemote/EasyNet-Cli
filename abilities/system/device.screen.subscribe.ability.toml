schema_version = "1"
name = "device.screen.subscribe"
description = "Subscribe to a screen target. Subject MUST be a screen resource_uri whose type is `display`, `application`, or `window` (use meta.list_resources to discover). Optional `region` arg is valid ONLY when subject's type is `display` (window/application bounds are self-defining)."

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.codec]
type = "string"
enum = ["h264", "raw", "vp9"]

[input_schema.properties.fps]
type = "integer"
minimum = 1
maximum = 60

[input_schema.properties.region]
type = "object"
additionalProperties = false

[input_schema.properties.region.properties.h]
type = "integer"
minimum = 1

[input_schema.properties.region.properties.w]
type = "integer"
minimum = 1

[input_schema.properties.region.properties.x]
type = "integer"
minimum = 0

[input_schema.properties.region.properties.y]
type = "integer"
minimum = 0

[input_schema.properties.resolution]
type = "string"
