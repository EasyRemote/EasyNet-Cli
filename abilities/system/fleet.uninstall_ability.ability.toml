schema_version = "1"
name = "fleet.uninstall_ability"
description = "Uninstall an ability from a node. Mirrors `fleet.deploy_ability`: local target acknowledged in v1, remote targets queued for the federation Invoke replacement."

[input_schema]
type = "object"
required = ["ability_name"]
additionalProperties = false

[input_schema.properties.ability_name]
type = "string"

[input_schema.properties.install_id]
type = "string"

[input_schema.properties.node_id]
type = "string"
