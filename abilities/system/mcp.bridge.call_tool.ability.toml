schema_version = "1"
name = "mcp.bridge.call_tool"
description = "Invoke a tool advertised by mcp.bridge.list_tools. Mirrors the MCP tools/call shape: returns {content:[{type:\"text\",text}], isError}. Visibility is re-checked against the live descriptor catalogue on each call, so a stale list_tools cache cannot bypass the bridge filter."

[input_schema]
type = "object"
required = ["name"]
additionalProperties = false

[input_schema.properties.name]
type = "string"
minLength = 1

[input_schema.properties.arguments]
description = "Free-form per-tool args; shape per the tool's own input_schema."
