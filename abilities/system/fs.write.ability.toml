schema_version = "1"
name = "fs.write"
description = "Atomically write a file (tempfile in the same directory, fdatasync, then rename) on the host's filesystem. Part of the baseline-locomotion-v1 profile (AXIOM §Tier 2.5). The fdatasync before rename closes the well-known crash-window where ext4/XFS may present a zero-byte file after power loss between rename and the deferred data flush. A crashed write thus leaves the prior content intact even on the bad-day filesystem path. The receipt records path, byte count, and content hash, but never the bytes themselves."

[input_schema]
type = "object"
required = ["path", "content"]
additionalProperties = false

[input_schema.properties.path]
type = "string"
minLength = 1

[input_schema.properties.content]
description = "File content. base64 string (default) or UTF-8 text (with encoding=\"utf8\") or array of bytes."

[input_schema.properties.encoding]
type = "string"
enum = ["base64", "utf8"]
description = "How to interpret a string-shaped content. Default base64."

[input_schema.properties.mode]
type = "integer"
minimum = 0
description = "Unix permission bits (0o644, 0o755, etc.). When set, the caller wins. When unset and the target file already exists, the receiver preserves the target's existing mode (so overwriting a chmod-600 secret keeps the 600). When unset and the target is new, falls back to umask default. Ignored on non-Unix hosts."

[input_schema.properties.create_parents]
type = "boolean"
description = "Create missing parent directories. Default false."

[input_schema.properties.expected_mtime_ms]
type = "integer"
minimum = 0
description = "Optional staleness guard. Caller asserts the target's mtime (milliseconds since UNIX epoch) matches the value last seen — typically captured from a prior fs.read response's mtime_ms field. Receiver stats the file before writing and rejects if the actual mtime differs (or the file does not exist). Stateless equivalent of an editor's read-before-write check; protects against silently clobbering concurrent edits."
