schema_version = "1"
name = "device.skill.unpublish"
description = "Remove a skill from an agent's skills/ directory. Hard delete of the skill subtree; daemon log records the deleted skill's content hash for recovery from backup."

[input_schema]
type = "object"
required = ["owner_agent_id", "skill_name"]

[input_schema.properties.owner_agent_id]
type = "string"

[input_schema.properties.skill_name]
type = "string"
