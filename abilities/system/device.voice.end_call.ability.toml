schema_version = "1"
name = "device.voice.end_call"
description = "Terminate a call. Idempotent: a second invocation returns the existing terminal envelope with `already_ended = true` rather than erroring."

[input_schema]
type = "object"
required = ["call_id"]
additionalProperties = false

[input_schema.properties.call_id]
type = "string"

[input_schema.properties.end_reason]
type = "integer"
minimum = 0
