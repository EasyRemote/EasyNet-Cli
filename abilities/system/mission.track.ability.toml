schema_version = "1"
name = "mission.track"
description = "Read the persisted state of a prior `easynet.run` invocation by run id. Returns the same shape `easynet.run` surfaces (run_id, run_dir, outputs, meta, ok) reconstructed from the on-disk run dir. Use it to poll a long-running mission without holding the original RPC open."

[input_schema]
type = "object"
required = ["run_id"]
additionalProperties = false

[input_schema.properties.run_id]
type = "string"
description = "The run id returned by an earlier `easynet.run` call (the trailing component of run_dir)."
