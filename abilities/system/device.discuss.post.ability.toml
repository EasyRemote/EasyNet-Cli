schema_version = "1"
name = "device.discuss.post"
description = "Append one turn to a room. Returns the assigned `sequence`. The optional `payload` field carries structured data alongside the message text."

[input_schema]
type = "object"
required = ["room_id", "speaker", "message"]
additionalProperties = false

[input_schema.properties.message]
type = "string"

[input_schema.properties.payload]

[input_schema.properties.room_id]
type = "string"

[input_schema.properties.speaker]
type = "string"
