schema_version = "1"
name = "mission.discuss_round"
description = "Run one sub-turn of a multi-agent discussion. Each cycle every listed agent is queried in parallel against the same transcript snapshot; an agent may speak (its reply is posted to the room and visible on the discuss.subscribe stream) or skip (reply is `[SKIP]`). Termination: every agent skips a cycle, or `max_cycles` reached. Returns the cycle log, the speakers each cycle, and any per-agent errors that occurred. Per-(room, agent) chat sessions persist history across sub-turns. The CLI surface (`easynet mission discuss …`) wraps this for human-bracketed turns."

[input_schema]
type = "object"
required = ["room_id", "agents"]
additionalProperties = false

[input_schema.properties.agents]
type = "array"
items = { type = "string" }
minItems = 1

[input_schema.properties.max_cycles]
type = "integer"
minimum = 1
maximum = 100

[input_schema.properties.roles]
type = "object"
additionalProperties = { type = "string" }
description = "Optional operator-pinned role per agent. Shape: { \"<agent_name>\": \"<role description>\" }. Agents named here skip self-nomination in cycle 1 and stay in the assigned role through the sub-turn."

[input_schema.properties.room_id]
type = "string"

[input_schema.properties.topic]
type = "string"
