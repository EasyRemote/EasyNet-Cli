schema_version = "1"
name = "device.browser.send_input"
description = "[V0 MOCK — NOT YET FUNCTIONAL; replaced by real WebView in RFC-013 W1] Inject a user input event (click / mousedown / mouseup / mousemove / scroll / keydown / keyup / text / navigate) into an open WebView session. session_ura MUST reference a live session. High-frequency events (scroll, mousemove) SHOULD be coalesced by the caller before invocation; v0 stores the timestamp but does not buffer beyond the most recent event."

[input_schema]
type = "object"
required = ["session_ura", "event"]
additionalProperties = false

[input_schema.properties.event]
type = "object"
required = ["kind"]

[input_schema.properties.event.properties.button]
type = "string"
enum = ["left", "middle", "right"]

[input_schema.properties.event.properties.delta_x]
type = "number"

[input_schema.properties.event.properties.delta_y]
type = "number"

[input_schema.properties.event.properties.key]
type = "string"

[input_schema.properties.event.properties.kind]
type = "string"
enum = ["click", "mousedown", "mouseup", "mousemove", "scroll", "keydown", "keyup", "text", "navigate"]

[input_schema.properties.event.properties.text]
type = "string"

[input_schema.properties.event.properties.url]
type = "string"

[input_schema.properties.event.properties.x]
type = "integer"

[input_schema.properties.event.properties.y]
type = "integer"

[input_schema.properties.session_ura]
type = "string"
description = "Session URA returned by device.browser.open_session."
minLength = 1
