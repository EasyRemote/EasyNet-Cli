schema_version = "1"
name = "device.fleet.list_abilities"
description = "List installed skills across registered agents. Combines marketplace installs (<agent-root>/skills/) with the agent-native global pools (~/.claude/skills, ~/.agents/skills)."

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.agent_id]
type = "string"
description = "Restrict the list to skills owned by this agent. Absent = every registered agent."
