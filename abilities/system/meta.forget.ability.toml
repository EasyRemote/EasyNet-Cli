schema_version = "1"
name = "meta.forget"
description = "Remove a learned ability copy from an agent workspace. Native authored abilities are not removed through this surface."

[input_schema]
type = "object"
required = ["ability", "agent"]
additionalProperties = false

[input_schema.properties.ability]
type = "string"
description = "Public learned ability name to remove from the agent workspace."

[input_schema.properties.agent]
type = "string"
description = "Local agent name that previously learned the ability."
