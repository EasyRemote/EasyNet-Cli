schema_version = "1"
name = "device.agent.start"
description = "Register a new LLM sub-agent (claude/codex/…) in the device's agent registry. v1 mirrors `easynet agent add`; the canonical URA in the response follows the §1.4 hosted-Agent shape. replaced_prior=true means the call overwrote an existing row."

[input_schema]
type = "object"
required = ["name", "agent_type"]
additionalProperties = false

[input_schema.properties.agent_type]
type = "string"
enum = ["claude-code", "claude", "codex", "codex-app-server", "codex-appserver"]

[input_schema.properties.model]
type = "string"

[input_schema.properties.name]
type = "string"
minLength = 1
