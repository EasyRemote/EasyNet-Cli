schema_version = "1"
name = "voice.watch_call"
description = "Read the accumulated event log for a call. v1 returns a snapshot (`view: \"snapshot\"`); the streaming variant lands when `register_stream` for voice.* is wired."

[input_schema]
type = "object"
required = ["call_id"]
additionalProperties = false

[input_schema.properties.call_id]
type = "string"
