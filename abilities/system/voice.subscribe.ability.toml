schema_version = "1"
name = "voice.subscribe"
description = "Subscribe to an LLM voice profile. Returns a server-pushed stream of TTS audio BinaryChunk frames. Subject MUST be a voice resource_uri (one llm may expose multiple voice profiles)."

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.format]
type = "string"
enum = ["opus"]

[input_schema.properties.sample_rate]
type = "integer"
enum = [24000, 48000]
