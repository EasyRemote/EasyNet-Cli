schema_version = "1"
name = "fs.read"
description = "Read a file from the host's filesystem (streamed up to max_bytes; no read-then-truncate path that could OOM the receiver on a multi-GB target). With encoding=\"utf8\" the optional offset_lines / limit_lines pair selects a 1-based line window. Blocked-device paths (/dev/{zero,random,urandom,stdin,stdout,tty}, /proc/self/fd/{0,1,2}) reject — they would otherwise hang the receiver thread or alias the agent's own stdio. Part of the baseline-locomotion-v1 profile (AXIOM §Tier 2.5)."

[input_schema]
type = "object"
required = ["path"]
additionalProperties = false

[input_schema.properties.path]
type = "string"
minLength = 1

[input_schema.properties.max_bytes]
type = "integer"
minimum = 0
maximum = 104857600
description = "Per-call read cap. Default 8 MiB. Hard cap 100 MiB. Read is streamed up to this cap; the underlying Vec is never sized past the cap, so a caller that overstates max_bytes against a multi-GB file cannot OOM the daemon."

[input_schema.properties.encoding]
type = "string"
enum = ["binary", "utf8"]
description = "Output encoding. binary = base64-encoded bytes; utf8 = UTF-8 text (errors if the file is not valid UTF-8)."

[input_schema.properties.offset_lines]
type = "integer"
minimum = 0
description = "1-based starting line for line-mode reads. Requires encoding=\"utf8\". 0 returns empty deterministically (caller bug, not aliased to 1)."

[input_schema.properties.limit_lines]
type = "integer"
minimum = 0
description = "Maximum lines to return after offset_lines. Requires encoding=\"utf8\". Line slicing happens AFTER the byte cap, so offset_lines past the byte-cap window returns empty even if the line exists in the file."
