schema_version = "1"
name = "device.invocation.history.get"
description = "Fetch one invocation ledger record by key.ura, key.request_id, or key.trace_id."

[input_schema]
type = "object"
required = ["key"]
additionalProperties = false

[input_schema.properties.filter]
type = "object"
additionalProperties = false

[input_schema.properties.filter.properties.abilities]
type = "array"
items = { minLength = 1, type = "string" }
description = "Ability names or ability URAs. Records match when ability_name or ability_ura equals any value."
minItems = 1
uniqueItems = true

[input_schema.properties.filter.properties.ability]
type = "string"
description = "Ability name or ability URA."

[input_schema.properties.filter.properties.callee]
type = "string"
description = "Callee URA."

[input_schema.properties.filter.properties.caller]
type = "string"
description = "Caller URA."

[input_schema.properties.filter.properties.state]
type = "string"

[input_schema.properties.filter.properties.subject]
description = "One subject URA or an array of subject URAs."
oneOf = [{ type = "string" }, { items = { type = "string" }, minItems = 1, type = "array", uniqueItems = true }]

[input_schema.properties.filter.properties.trace_id]
type = "string"

[input_schema.properties.key]
type = "object"
additionalProperties = false
maxProperties = 1
minProperties = 1

[input_schema.properties.key.properties.request_id]
type = "string"

[input_schema.properties.key.properties.trace_id]
type = "string"

[input_schema.properties.key.properties.ura]
type = "string"
description = "Invocation URA."
