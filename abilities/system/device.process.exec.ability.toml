schema_version = "1"
name = "device.process.exec"
description = "Run a process via OS-level argv (no shell interpretation). Part of the baseline-locomotion-v1 profile (AXIOM §Tier 2.5). For pipe/redirect/glob, use shell.run instead. Destructive commands (rm/dd/mkfs/fdisk family) require destructive_acknowledged=true."

[input_schema]
type = "object"
required = ["command"]
additionalProperties = false

[input_schema.properties.args]
type = "array"
items = { type = "string" }

[input_schema.properties.command]
type = "string"
minLength = 1

[input_schema.properties.cwd]
type = "string"

[input_schema.properties.destructive_acknowledged]
type = "boolean"

[input_schema.properties.env]
type = "object"
additionalProperties = { type = "string" }

[input_schema.properties.output_max_bytes]
type = "integer"
minimum = 0
maximum = 104857600

[input_schema.properties.sandbox]
type = "boolean"

[input_schema.properties.stdin]
oneOf = [{ description = "base64 (default) or UTF-8 with stdin_encoding=\"utf8\"", type = "string" }, { items = { maximum = 255, minimum = 0, type = "integer" }, type = "array" }, { type = "null" }]

[input_schema.properties.stdin_encoding]
type = "string"
enum = ["base64", "utf8"]

[input_schema.properties.timeout_ms]
type = "integer"
minimum = 0
maximum = 3600000
