schema_version = "1"
name = "fs.list"
description = "List the contents of a directory on the host's filesystem. Part of the baseline-locomotion-v1 profile (AXIOM §Tier 2.5)."

[input_schema]
type = "object"
required = ["path"]
additionalProperties = false

[input_schema.properties.max_entries]
type = "integer"
minimum = 1

[input_schema.properties.path]
type = "string"
minLength = 1

[input_schema.properties.recursive]
type = "boolean"
