schema_version = "1"
name = "device.a2a.client.send_task"
description = "Outbound A2A: dispatch an RPC Invoke against a remote node's ability. Resolves to `<agent_name>.<skill_name>` on the named node and routes through daemon-hosted federation.forward_invoke. Returns {ok:true,result} on success; remote failures surface as {ok:false,error} so callers can branch without a try/catch. The `args` payload is OPAQUE to the daemon — its shape is the remote skill's input_schema contract and is not validated locally."

[input_schema]
type = "object"
required = ["agent_name", "skill_name"]
additionalProperties = false
anyOf = [{ required = ["target_node_ura"] }, { required = ["target_node_uri"] }]

[input_schema.properties.agent_name]
type = "string"
minLength = 1

[input_schema.properties.args]
description = "Free-form per-skill args; shape per the remote skill's input_schema."

[input_schema.properties.skill_name]
type = "string"
minLength = 1

[input_schema.properties.target_node_ura]
type = "string"
minLength = 1

[input_schema.properties.target_node_uri]
type = "string"
description = "Deprecated alias for target_node_ura; accepted during the URI-to-URA migration window."
minLength = 1
