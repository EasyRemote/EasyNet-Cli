schema_version = "1"
name = "voice.transcribe"
description = "Stream audio in, receive transcription text out. True bidi: caller pushes audio BinaryChunk UP, callee returns text BinaryChunk (or structured JSON) DOWN. Subject MUST be an ASR-model resource_uri."

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.format]
type = "string"
enum = ["opus"]

[input_schema.properties.language]
type = "string"
description = "ISO 639-1 code or `auto`."

[input_schema.properties.model_hint]
type = "string"
