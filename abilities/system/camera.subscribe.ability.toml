schema_version = "1"
name = "camera.subscribe"
description = "Subscribe to a camera resource. Returns a server-pushed stream of video BinaryChunk frames at the requested fps / resolution / codec. Subject MUST be a camera resource_ura."

[input_schema]
type = "object"
additionalProperties = false

[input_schema.properties.codec]
type = "string"
enum = ["h264", "raw", "vp9"]

[input_schema.properties.fps]
type = "integer"
minimum = 1
maximum = 60

[input_schema.properties.resolution]
type = "string"
