schema_version = "1"
name = "a2a.bridge.send_task"
description = "Dispatch an A2A task against a locally-hosted agent. Resolves to the in-process registry name `<agent_name>.<skill_name>`; visibility is re-checked against the live AgentRegistry on each call. Returns {ok:true, result} or {ok:false, error}."

[input_schema]
type = "object"
required = ["agent_name", "skill_name"]
additionalProperties = false

[input_schema.properties.agent_name]
type = "string"
minLength = 1

[input_schema.properties.args]
description = "Free-form per-skill args; shape per the skill's own input schema."

[input_schema.properties.skill_name]
type = "string"
minLength = 1
