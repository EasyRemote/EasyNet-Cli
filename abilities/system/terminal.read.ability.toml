schema_version = "1"
name = "terminal.read"
description = "Drain a PTY session's stdout up to a timeout. Returns base64 bytes; sets `code: \"session_dead\"` once the child has exited and the buffer is fully drained."

[input_schema]
type = "object"
required = ["session_id"]
additionalProperties = false

[input_schema.properties.session_id]
type = "string"
minLength = 1

[input_schema.properties.timeout]
type = "number"
description = "seconds to wait for output before returning empty"
minimum = 0
maximum = 60.0
