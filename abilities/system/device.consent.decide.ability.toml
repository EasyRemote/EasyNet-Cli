schema_version = "1"
name = "device.consent.decide"
description = "Deliver a decision for a pending permission request by id. Decision must be one of `allow`, `deny`, or `allow_once`. v1 cross-machine semantics: advisory only."

[input_schema]
type = "object"
required = ["id", "decision"]
additionalProperties = false

[input_schema.properties.decision]
type = "string"
enum = ["allow", "deny", "allow_once"]

[input_schema.properties.id]
type = "string"
